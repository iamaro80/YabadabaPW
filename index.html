    <!-- Inline SVG Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔐</text></svg>">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    }
                }
            }
        }
    </script>

        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb {
            background-color: rgba(140, 150, 180, 0.3);

    <!-- React & ReactDOM Production CDNs -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="h-full antialiased transition-colors duration-300">
    <div id="root" class="h-full"></div>

    <script type="text/babel">
        const PALETTES = {
            nordic: {
                id: 'nordic',
                name: 'Nordic Periwinkle',
                tag: 'Palette 1',
                emoji: '❄️',
                isDark: false,
                bodyBg: 'bg-[#F8F9FC]',
                bodyBgHex: '#F8F9FC',
                headerBg: 'bg-[#FFFFFF]/90 border-[#BFC8EA]',
                cardBg: 'bg-[#FFFFFF] border-[#BFC8EA] shadow-[0_10px_30px_rgba(123,134,170,0.12)]',
                textPrimary: 'text-[#545051]',
                textMuted: 'text-[#7B86AA]',
                inputBg: 'bg-[#F8F9FC] border-[#BFC8EA] text-[#545051]',
                btnPrimary: 'bg-[#5B67A2] hover:bg-[#4E598E] text-[#FFFFFF]',
                btnSecondary: 'bg-[#FFFFFF] hover:bg-[#F8F9FC] border-[#BFC8EA] text-[#545051]',
                accentText: 'text-[#5B67A2]',
                badgeBorder: 'border-[#BFC8EA]',
                badgeBg: 'bg-[#BFC8EA]/40 text-[#5B67A2]',
                chipActive: 'bg-[#5B67A2] text-[#FFFFFF] border-[#5B67A2]',
                chipInactive: 'bg-[#FFFFFF] text-[#545051] border-[#BFC8EA] hover:bg-[#F8F9FC]',
                gaugeTrack: 'bg-[#BFC8EA]/30',
                gaugeBar: 'bg-[#738BE7]',
                accentColorHex: '#738BE7',
                subCardBg: 'bg-[#F8F9FC]/70 border-[#BFC8EA]',
                divider: 'border-[#BFC8EA]/60',
                footerBorder: 'border-[#BFC8EA]/60',
                tabActive: 'bg-[#5B67A2] text-white border-[#5B67A2]',
                tabInactive: 'text-[#7B86AA] hover:text-[#545051]',
            },
            sunset: {
                id: 'sunset',
                name: 'Sunset Coral & Plum',
                tag: 'Palette 2',
                emoji: '🌅',
                isDark: true,
                bodyBg: 'bg-[#35284A]',
                bodyBgHex: '#35284A',
                headerBg: 'bg-[#291E3B]/90 border-[#816F90]',
                cardBg: 'bg-[#271C38] border-[#816F90] shadow-[0_12px_36px_rgba(0,0,0,0.4)]',
                textPrimary: 'text-[#F8D9C3]',
                textMuted: 'text-[#FADDA5]',
                inputBg: 'bg-[#1E152B] border-[#816F90]/70 text-[#F8D9C3]',
                btnPrimary: 'bg-[#FB7D79] hover:bg-[#F56C68] text-[#271C38] font-bold',
                btnSecondary: 'bg-[#35284A] hover:bg-[#3E2F56] border-[#816F90] text-[#F8D9C3]',
                accentText: 'text-[#FB7D79]',
                badgeBorder: 'border-[#816F90]',
                badgeBg: 'bg-[#FB9D7E]/25 text-[#FB7D79]',
                chipActive: 'bg-[#FB7D79] text-[#271C38] border-[#FB7D79] font-bold',
                chipInactive: 'bg-[#1E152B] text-[#F8D9C3] border-[#816F90]/70 hover:bg-[#35284A]',
                gaugeTrack: 'bg-[#1E152B]',
                gaugeBar: 'bg-gradient-to-r from-[#FB9D7E] to-[#FB7D79]',
                accentColorHex: '#FB7D79',
                subCardBg: 'bg-[#1E152B]/70 border-[#816F90]/70',
                divider: 'border-[#816F90]/50',
                footerBorder: 'border-[#816F90]/50',
                tabActive: 'bg-[#FB7D79] text-[#271C38] border-[#FB7D79] font-bold',
                tabInactive: 'text-[#816F90] hover:text-[#F8D9C3]',
            },
            navy: {
                id: 'navy',
                name: 'Deep Navy & Sage Olive',
                tag: 'Palette 6',
                emoji: '⚓️',
                isDark: true,
                bodyBg: 'bg-[#040A1B]',
                bodyBgHex: '#040A1B',
                headerBg: 'bg-[#0A122A]/90 border-[#334465]',
                cardBg: 'bg-[#0C1429] border-[#334465] shadow-[0_14px_40px_rgba(0,0,0,0.6)]',
                textPrimary: 'text-[#FEFEFE]',
                textMuted: 'text-[#A5BECF]',
                inputBg: 'bg-[#040A1B] border-[#334465] text-[#FEFEFE]',
                btnPrimary: 'bg-[#335495] hover:bg-[#2A457D] text-[#FEFEFE] border border-[#668BC4]/30',
                btnSecondary: 'bg-[#0A122A] hover:bg-[#121E3E] border-[#334465] text-[#FEFEFE]',
                accentText: 'text-[#91A471]',
                badgeBorder: 'border-[#334465]',
                badgeBg: 'bg-[#91A471]/20 text-[#91A471]',
                chipActive: 'bg-[#91A471] text-[#040A1B] border-[#91A471] font-bold',
                chipInactive: 'bg-[#040A1B] text-[#A5BECF] border-[#334465] hover:bg-[#0A122A]',
                gaugeTrack: 'bg-[#040A1B]',
                gaugeBar: 'bg-[#91A471]',
                accentColorHex: '#91A471',
                subCardBg: 'bg-[#040A1B]/70 border-[#334465]',
                divider: 'border-[#334465]/60',
                footerBorder: 'border-[#334465]/60',
                tabActive: 'bg-[#335495] text-white border-[#668BC4]/40 font-bold',
                tabInactive: 'text-[#A5BECF] hover:text-white',
            }
        };

        function App() {
            // Theme state supporting Nordic (1), Sunset (2), and Navy Sage (6)
            const [themeKey, setThemeKey] = React.useState(() => {
                try {
                    const saved = localStorage.getItem('yabadabapw_palette');
                    if (saved && PALETTES[saved]) return saved;
                    return 'nordic';
                } catch (e) {
                    return 'nordic';
                }
            });

            const t = PALETTES[themeKey] || PALETTES.nordic;

            // Synchronize document dark class and background color
            React.useEffect(() => {
                try {
                    if (t.isDark) {
                        document.documentElement.classList.add('dark');
                    } else {
                        document.documentElement.classList.remove('dark');
                    }
                    document.body.className = `h-full antialiased transition-colors duration-300 ${t.bodyBg}`;
                    localStorage.setItem('yabadabapw_palette', themeKey);
                } catch (e) {
                    console.error('Failed to sync theme', e);
                }
            }, [themeKey, t]);

            const [password, setPassword] = React.useState('');
            const [length, setLength] = React.useState(16);
            const [includeUpper, setIncludeUpper] = React.useState(true);
            const [includeLower, setIncludeLower] = React.useState(true);
            const [includeNumbers, setIncludeNumbers] = React.useState(true);
            const [includeSymbols, setIncludeSymbols] = React.useState(true);
            const [excludeAmbiguous, setExcludeAmbiguous] = React.useState(false);

            // Custom symbols options
            const [symbolMode, setSymbolMode] = React.useState('default');
            const [customSymbols, setCustomSymbols] = React.useState('#@$&%!');

            // Leading character option
            const [leadingChar, setLeadingChar] = React.useState('any');

            const [copied, setCopied] = React.useState(false);
            const [copiedVaultIdx, setCopiedVaultIdx] = React.useState(null);
            const [saveNotification, setSaveNotification] = React.useState(false);

            // Persistent saved passwords vault in localStorage
            const [savedPasswords, setSavedPasswords] = React.useState(() => {
                try {
                    const stored = localStorage.getItem('yabadabapw_saved');
                    return stored ? JSON.parse(stored) : [];
                } catch (e) {
                    return [];
                }
            });

            React.useEffect(() => {
                try {
                    localStorage.setItem('yabadabapw_saved', JSON.stringify(savedPasswords));
                } catch (e) {
                    console.error('Failed to save to localStorage', e);
                }
            }, [savedPasswords]);

            // Character sets
            const uppercaseBase = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            const lowercaseBase = 'abcdefghijklmnopqrstuvwxyz';
            const numberBase = '0123456789';
            const defaultSymbols = '!@#$%^&*()_+-=[]{}|;:,.<>?';
            const ambiguousChars = ['0', 'O', 'o', 'I', 'l', '1', '|', ';', ':'];

            const filterAmbiguous = (str) => {
                if (!excludeAmbiguous) return str;
                return str.split('').filter(c => !ambiguousChars.includes(c)).join('');
            };

            const getActiveSymbols = () => {
                if (symbolMode === 'custom') {
                    return typeof customSymbols === 'string' ? customSymbols : '#@$&%!';
                }
                return defaultSymbols;
            };

            const isCustomSymbolsValid = () => {
                if (symbolMode === 'custom' && includeSymbols) {
                    const s = typeof customSymbols === 'string' ? customSymbols : '';
                    return s.length >= 3;
                }
                return true;
            };

            // Calculate mathematical entropy in bits
            const getStrengthMetrics = () => {
                if (!password || password.startsWith('Error')) {
                    return { bits: 0, label: 'None', width: '0%' };
                }
                let poolSize = 0;
                if (includeUpper) poolSize += filterAmbiguous(uppercaseBase).length;
                if (includeLower) poolSize += filterAmbiguous(lowercaseBase).length;
                if (includeNumbers) poolSize += filterAmbiguous(numberBase).length;
                if (includeSymbols && isCustomSymbolsValid()) poolSize += filterAmbiguous(getActiveSymbols()).length;

                if (poolSize === 0) return { bits: 0, label: 'None', width: '0%' };

                const bits = Math.round(password.length * Math.log2(poolSize));
                if (bits < 36) {
                    return { bits, label: 'Weak', width: '25%' };
                } else if (bits < 60) {
                    return { bits, label: 'Fair', width: '50%' };
                } else if (bits < 80) {
                    return { bits, label: 'Strong', width: '75%' };
                } else {
                    return { bits, label: 'Very Strong', width: '100%' };
                }
            };

            const generatePassword = React.useCallback(() => {
                if (symbolMode === 'custom' && includeSymbols && !isCustomSymbolsValid()) {
                    setPassword('Error: Custom symbols must have 3+ characters!');
                    return;
                }

                const activeSymbols = filterAmbiguous(getActiveSymbols());
                const activeUpper = filterAmbiguous(uppercaseBase);
                const activeLower = filterAmbiguous(lowercaseBase);
                const activeNumbers = filterAmbiguous(numberBase);

                let charPool = '';
                let requiredCategories = [];

                if (includeUpper && activeUpper.length > 0) {
                    charPool += activeUpper;
                    requiredCategories.push(activeUpper);
                }
                if (includeLower && activeLower.length > 0) {
                    charPool += activeLower;
                    requiredCategories.push(activeLower);
                }
                if (includeNumbers && activeNumbers.length > 0) {
                    charPool += activeNumbers;
                    requiredCategories.push(activeNumbers);
                }
                if (includeSymbols && isCustomSymbolsValid() && activeSymbols.length > 0) {
                    charPool += activeSymbols;
                    requiredCategories.push(activeSymbols);
                }

                if (charPool === '' || requiredCategories.length === 0) {
                    setPassword('Error: Please select at least one character set!');
                    return;
                }

                const effectiveLength = Math.max(length, requiredCategories.length);

                let resultChars = [];
                const randomValues = new Uint32Array(effectiveLength);
                window.crypto.getRandomValues(randomValues);

                // 1. Guarantee at least one character from each selected category
                for (let idx = 0; idx < requiredCategories.length; idx++) {
                    const category = requiredCategories[idx];
                    const randomIndex = randomValues[idx] % category.length;
                    resultChars.push(category[randomIndex]);
                }

                // 2. Fill remainder randomly
                for (let i = resultChars.length; i < effectiveLength; i++) {
                    const randomIndex = randomValues[i] % charPool.length;
                    resultChars.push(charPool[randomIndex]);
                }

                // 3. Cryptographically secure Fisher-Yates shuffle with fresh entropy
                const shuffleEntropy = new Uint32Array(resultChars.length);
                window.crypto.getRandomValues(shuffleEntropy);
                for (let i = resultChars.length - 1; i > 0; i--) {
                    const j = shuffleEntropy[i] % (i + 1);
                    const temp = resultChars[i];
                    resultChars[i] = resultChars[j];
                    resultChars[j] = temp;
                }

                // 4. Enforce Leading Character preference if specified
                if (leadingChar !== 'any') {
                    let targetPool = '';
                    if (leadingChar === 'upper' && includeUpper) targetPool = activeUpper;
                    if (leadingChar === 'lower' && includeLower) targetPool = activeLower;
                    if (leadingChar === 'number' && includeNumbers) targetPool = activeNumbers;
                    if (leadingChar === 'symbol' && includeSymbols && isCustomSymbolsValid()) targetPool = activeSymbols;

                    if (targetPool && targetPool.length > 0) {
                        const matchIndex = resultChars.findIndex(c => targetPool.includes(c));
                        if (matchIndex !== -1) {
                            const temp = resultChars[0];
                            resultChars[0] = resultChars[matchIndex];
                            resultChars[matchIndex] = temp;
                        } else {
                            const leadRand = new Uint32Array(1);
                            window.crypto.getRandomValues(leadRand);
                            resultChars[0] = targetPool[leadRand[0] % targetPool.length];
                        }
                    }
                }

                const finalStr = resultChars.join('');
                setPassword(finalStr);
                setCopied(false);
            }, [length, includeUpper, includeLower, includeNumbers, includeSymbols, excludeAmbiguous, symbolMode, customSymbols, leadingChar]);

            // Auto-generate on configuration change
            React.useEffect(() => {
                generatePassword();
            }, [generatePassword]);

            // Reset leading character if its selected character set becomes disabled
            React.useEffect(() => {
                if (leadingChar === 'upper' && !includeUpper) setLeadingChar('any');
                if (leadingChar === 'lower' && !includeLower) setLeadingChar('any');
                if (leadingChar === 'number' && !includeNumbers) setLeadingChar('any');
                if (leadingChar === 'symbol' && (!includeSymbols || !isCustomSymbolsValid())) setLeadingChar('any');
            }, [includeUpper, includeLower, includeNumbers, includeSymbols, symbolMode, customSymbols, leadingChar]);

            const copyToClipboard = (textToCopy, isVaultIdx = null) => {
                const str = typeof textToCopy === 'string' ? textToCopy : String(textToCopy || '');
                if (!str || str.startsWith('Error')) return;

                const onSuccess = () => {
                    if (isVaultIdx !== null) {
                        setCopiedVaultIdx(isVaultIdx);
                        setTimeout(() => setCopiedVaultIdx(null), 1500);
                    } else {
                        setCopied(true);
                        setTimeout(() => setCopied(false), 2000);
                    }
                };

                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(str).then(onSuccess).catch(() => fallbackCopy(str, onSuccess));
                } else {
                    fallbackCopy(str, onSuccess);
                }
            };

            const fallbackCopy = (str, cb) => {
                const textArea = document.createElement("textarea");
                textArea.value = str;
                textArea.style.position = "fixed";
                textArea.style.opacity = "0";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                try {
                    document.execCommand('copy');
                    if (cb) cb();
                } catch (err) {
                    console.error('Fallback copy failed', err);
                }
                document.body.removeChild(textArea);
            };

            const saveToList = () => {
                const pwdStr = typeof password === 'string' ? password : String(password || '');
                if (!pwdStr || pwdStr.startsWith('Error')) return;
                if (!savedPasswords.includes(pwdStr)) {
                    setSavedPasswords([pwdStr, ...savedPasswords]);
                    setSaveNotification(true);
                    setTimeout(() => setSaveNotification(false), 2000);
                }
            };

            const removeSavedItem = (indexToRemove) => {
                setSavedPasswords(savedPasswords.filter((_, idx) => idx !== indexToRemove));
            };

            const clearList = () => {
                if (window.confirm('Are you sure you want to clear your local vault?')) {
                    setSavedPasswords([]);
                }
            };

            const downloadListAsTxt = () => {
                if (!Array.isArray(savedPasswords) || savedPasswords.length === 0) return;
                const fileContent = `# YabadabaPW Vault Export\n# Theme: ${t.name}\n# Exported on ${new Date().toLocaleString()}\n\n` + savedPasswords.join('\n');
                const blob = new Blob([fileContent], { type: 'text/plain;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `yabadabapw-vault-${new Date().toISOString().slice(0, 10)}.txt`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
            };

            const strength = getStrengthMetrics();
            const isError = !password || password.startsWith('Error');

            return (
                <div className={`${t.bodyBg} ${t.textPrimary} min-h-full flex flex-col justify-between transition-colors duration-300 font-sans`}>
                    
                    {/* Top App Bar with 3-Palette Switcher */}
                    <header className={`border-b ${t.headerBg} sticky top-0 z-20 backdrop-blur-md transition-colors`}>
                        <div className="max-w-4xl mx-auto px-6 py-4 flex flex-col sm:flex-row items-center justify-between gap-3 sm:gap-0">
                            <div className="flex items-center space-x-3.5">
                                <div className={`w-10 h-10 rounded-2xl ${t.btnPrimary} flex items-center justify-center font-bold text-lg shadow-sm transition-all`}>
                                    YP
                                </div>
                                <div>
                                    <div className="flex items-center space-x-2">
                                        <h1 className="text-xl font-bold tracking-tight leading-none">
                                            YabadabaPW
                                        </h1>
                                        <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full border ${t.badgeBg} ${t.badgeBorder}`}>
                                            {t.tag}
                                        </span>
                                    </div>
                                    <p className={`text-[11px] font-medium mt-1 ${t.textMuted}`}>
                                        Custom Rule-Compliant Strong Password Generator
                                    </p>
                                </div>
                            </div>

                            {/* 3-Palette Switcher Buttons */}
                            <div className="flex items-center space-x-1.5 p-1 rounded-2xl border border-black/10 dark:border-white/10 bg-black/5 dark:bg-white/5">
                                <button
                                    onClick={() => setThemeKey('nordic')}
                                    className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all flex items-center space-x-1 border ${
                                        themeKey === 'nordic' ? PALETTES.nordic.tabActive : PALETTES.nordic.tabInactive + ' border-transparent'
                                    }`}
                                    title="Palette 1: Nordic Periwinkle (Light Mode)"
                                >
                                    <span>❄️</span>
                                    <span>Nordic</span>
                                </button>
                                <button
                                    onClick={() => setThemeKey('sunset')}
                                    className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all flex items-center space-x-1 border ${
                                        themeKey === 'sunset' ? PALETTES.sunset.tabActive : PALETTES.sunset.tabInactive + ' border-transparent'
                                    }`}
                                    title="Palette 2: Sunset Coral & Plum (Dark Mode)"
                                >
                                    <span>🌅</span>
                                    <span>Sunset</span>
                                </button>
                                <button
                                    onClick={() => setThemeKey('navy')}
                                    className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all flex items-center space-x-1 border ${
                                        themeKey === 'navy' ? PALETTES.navy.tabActive : PALETTES.navy.tabInactive + ' border-transparent'
                                    }`}
                                    title="Palette 6: Deep Navy & Sage (Dark Mode)"
                                >
                                    <span>⚓️</span>
                                    <span>Navy Sage</span>
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Main Content Area */}
                    <main className="max-w-3xl mx-auto px-6 py-8 w-full flex-grow space-y-6">
                        
                        {/* Password Viewport Card */}
                        <div className={`rounded-3xl p-6 sm:p-7 border transition-all ${t.cardBg}`}>
                            <div className="flex justify-between items-center mb-3">
                                <div className="flex items-center space-x-2">
                                    <span className={`w-2 h-2 rounded-full ${t.accentBg}`}></span>
                                    <label className={`text-xs font-bold uppercase tracking-wider ${t.textMuted}`}>
                                        Generated Password
                                    </label>
                                </div>
                                {!isError && (
                                    <div className={`px-3 py-1 rounded-full text-xs font-bold border flex items-center space-x-1.5 ${t.badgeBg} ${t.badgeBorder}`}>
                                        <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 inline-block"></span>
                                        <span className="font-mono text-xs">{strength.bits} BITS</span>
                                        <span className="opacity-40">•</span>
                                        <span>{strength.label}</span>
                                    </div>
                                )}
                            </div>

                            {/* Password Box & Actions */}
                            <div className="flex flex-col sm:flex-row items-stretch sm:items-center gap-3">
                                <div 
                                    className={`rounded-2xl px-5 py-4 font-mono text-xl sm:text-2xl tracking-wider flex-grow select-all break-all border transition-colors ${
                                        isError
                                            ? 'border-rose-500/50 text-rose-500 bg-rose-500/10'
                                            : t.inputBg
                                    }`}
                                >
                                    {String(password || '')}
                                </div>
                                <div className="flex gap-2 shrink-0">
                                    <button
                                        onClick={() => copyToClipboard(password)}
                                        disabled={isError}
                                        className={`px-6 py-4 font-bold text-xs uppercase tracking-wider rounded-2xl transition-all flex items-center justify-center space-x-2 shadow-sm ${
                                            isError
                                                ? 'opacity-40 cursor-not-allowed bg-zinc-300 text-zinc-500'
                                                : copied 
                                                    ? 'bg-emerald-600 text-white' 
                                                    : t.btnPrimary
                                        }`}
                                    >
                                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            {copied ? (
                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"/>
                                            ) : (
                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"/>
                                            )}
                                        </svg>
                                        <span>{copied ? 'Copied' : 'Copy'}</span>
                                    </button>

                                    <button
                                        onClick={saveToList}
                                        disabled={isError}
                                        className={`p-4 rounded-2xl border transition-all flex items-center justify-center shadow-sm ${
                                            isError ? 'opacity-40 cursor-not-allowed' : t.btnSecondary
                                        }`}
                                        title="Save password to vault"
                                    >
                                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"/>
                                        </svg>
                                    </button>

                                    <button
                                        onClick={generatePassword}
                                        className={`p-4 rounded-2xl border transition-all flex items-center justify-center shadow-sm active:rotate-180 duration-500 ${t.btnSecondary}`}
                                        title="Generate new key"
                                    >
                                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                                        </svg>
                                    </button>
                                </div>
                            </div>

                            {/* Entropy Gauge Line */}
                            {!isError && (
                                <div className="mt-4">
                                    <div className={`w-full h-1.5 rounded-full overflow-hidden ${t.gaugeTrack}`}>
                                        <div 
                                            className={`h-full transition-all duration-300 rounded-full ${t.gaugeBar}`}
                                            style={{ width: strength.width }}
                                        />
                                    </div>
                                </div>
                            )}

                            {saveNotification && (
                                <p className="text-xs font-semibold mt-3 text-emerald-500 flex items-center space-x-1">
                                    <span>✓</span>
                                    <span>Preserved in your local vault below.</span>
                                </p>
                            )}
                        </div>

                        {/* Configuration Dashboard Card */}
                        <div className={`rounded-3xl p-6 sm:p-7 border space-y-6 transition-all ${t.cardBg}`}>
                            
                            {/* Length Slider & Quick Preset Chips */}
                            <div className="space-y-3">
                                <div className="flex justify-between items-center text-xs font-bold uppercase tracking-wider">
                                    <span className={t.textMuted}>
                                        Password Length
                                    </span>
                                    <div className="flex items-center space-x-2">
                                        <div className="flex space-x-1 font-mono">
                                            {[12, 16, 24, 32].map((preset) => (
                                                <button
                                                    key={preset}
                                                    type="button"
                                                    onClick={() => setLength(preset)}
                                                    className={`px-2.5 py-1 rounded-lg text-xs transition-all border ${
                                                        length === preset ? t.chipActive : t.chipInactive
                                                    }`}
                                                >
                                                    {preset}
                                                </button>
                                            ))}
                                        </div>
                                        <span className={`font-mono px-3 py-1 rounded-full border text-xs font-bold ${t.badgeBg} ${t.badgeBorder}`}>
                                            {String(length)} Chars
                                        </span>
                                    </div>
                                </div>
                                <input
                                    type="range"
                                    min="8"
                                    max="64"
                                    value={length}
                                    onChange={(e) => setLength(parseInt(e.target.value, 10))}
                                    className="w-full h-2 rounded-lg appearance-none cursor-pointer bg-black/10 dark:bg-white/10 accent-current"
                                    style={{ accentColor: t.accentColorHex }}
                                />
                                <div className={`flex justify-between text-[11px] font-mono ${t.textMuted}`}>
                                    <span>8</span>
                                    <span>24</span>
                                    <span>40</span>
                                    <span>64</span>
                                </div>
                            </div>

                            <hr className={t.divider} />

                            {/* Character Set Toggles */}
                            <div className="space-y-3">
                                <label className={`text-xs font-bold uppercase tracking-wider block ${t.textMuted}`}>
                                    Character Sets
                                </label>
                                <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
                                    <label className={`flex items-center space-x-2.5 p-3.5 rounded-2xl border cursor-pointer transition-all ${
                                        includeUpper ? t.chipActive : t.chipInactive
                                    }`}>
                                        <input type="checkbox" checked={includeUpper} onChange={(e) => setIncludeUpper(e.target.checked)} className="rounded border-current"/>
                                        <span className="text-xs font-semibold">Uppercase</span>
                                    </label>
                                    <label className={`flex items-center space-x-2.5 p-3.5 rounded-2xl border cursor-pointer transition-all ${
                                        includeLower ? t.chipActive : t.chipInactive
                                    }`}>
                                        <input type="checkbox" checked={includeLower} onChange={(e) => setIncludeLower(e.target.checked)} className="rounded border-current"/>
                                        <span className="text-xs font-semibold">Lowercase</span>
                                    </label>
                                    <label className={`flex items-center space-x-2.5 p-3.5 rounded-2xl border cursor-pointer transition-all ${
                                        includeNumbers ? t.chipActive : t.chipInactive
                                    }`}>
                                        <input type="checkbox" checked={includeNumbers} onChange={(e) => setIncludeNumbers(e.target.checked)} className="rounded border-current"/>
                                        <span className="text-xs font-semibold">Numbers</span>
                                    </label>
                                    <label className={`flex items-center space-x-2.5 p-3.5 rounded-2xl border cursor-pointer transition-all ${
                                        includeSymbols ? t.chipActive : t.chipInactive
                                    }`}>
                                        <input type="checkbox" checked={includeSymbols} onChange={(e) => setIncludeSymbols(e.target.checked)} className="rounded border-current"/>
                                        <span className="text-xs font-semibold">Symbols</span>
                                    </label>
                                </div>
                            </div>

                            {/* Ambiguous Chars Toggle */}
                            <div>
                                <label className={`flex items-center space-x-2.5 p-3.5 rounded-2xl border cursor-pointer transition-all ${
                                    excludeAmbiguous ? t.chipActive : t.chipInactive
                                }`}>
                                    <input 
                                        type="checkbox" 
                                        checked={excludeAmbiguous} 
                                        onChange={(e) => setExcludeAmbiguous(e.target.checked)} 
                                        className="rounded border-current"
                                    />
                                    <div className="text-xs">
                                        <span className="font-bold">Exclude Ambiguous Characters</span>
                                        <span className={`block text-[11px] font-mono mt-0.5 opacity-80`}>
                                            Filters out visually confusing chars (0, O, o, 1, l, I, |, ;, :)
                                        </span>
                                    </div>
                                </label>
                            </div>

                            {/* Leading Char & Custom Symbols Row */}
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-1">
                                <div className={`border rounded-2xl p-4 space-y-2 ${t.subCardBg}`}>
                                    <label className={`text-xs font-bold uppercase tracking-wider block ${t.textMuted}`}>
                                        Start With (Leading Character)
                                    </label>
                                    <select
                                        value={leadingChar}
                                        onChange={(e) => setLeadingChar(e.target.value)}
                                        className={`w-full border rounded-xl px-3 py-2 text-xs font-semibold focus:outline-none ${t.inputBg}`}
                                    >
                                        <option value="any">Any (Random Start)</option>
                                        <option value="upper" disabled={!includeUpper}>Uppercase Letter (A-Z)</option>
                                        <option value="lower" disabled={!includeLower}>Lowercase Letter (a-z)</option>
                                        <option value="number" disabled={!includeNumbers}>Number (0-9)</option>
                                        <option value="symbol" disabled={!includeSymbols || !isCustomSymbolsValid()}>Symbol</option>
                                    </select>
                                </div>

                                <div className={`border rounded-2xl p-4 space-y-2 ${t.subCardBg}`}>
                                    <div className="flex justify-between items-center">
                                        <label className={`text-xs font-bold uppercase tracking-wider ${t.textMuted}`}>
                                            Custom Allowed Symbols
                                        </label>
                                        <div className="flex space-x-1 text-[11px]">
                                            <button 
                                                type="button"
                                                onClick={() => setSymbolMode('default')} 
                                                className={`px-2.5 py-0.5 rounded-full border transition-all text-xs font-bold ${
                                                    symbolMode === 'default' ? t.chipActive : 'border-transparent opacity-60 hover:opacity-100'
                                                }`}
                                            >
                                                Default
                                            </button>
                                            <button 
                                                type="button"
                                                onClick={() => setSymbolMode('custom')} 
                                                className={`px-2.5 py-0.5 rounded-full border transition-all text-xs font-bold ${
                                                    symbolMode === 'custom' ? t.chipActive : 'border-transparent opacity-60 hover:opacity-100'
                                                }`}
                                            >
                                                Custom
                                            </button>
                                        </div>
                                    </div>
                                    {symbolMode === 'custom' ? (
                                        <div>
                                            <input
                                                type="text"
                                                value={customSymbols}
                                                onChange={(e) => setCustomSymbols(e.target.value)}
                                                placeholder="Enter at least 3 symbols"
                                                className={`w-full border rounded-xl px-3 py-2 text-xs font-mono focus:outline-none ${
                                                    !isCustomSymbolsValid() ? 'border-rose-500' : t.inputBg
                                                }`}
                                            />
                                            {!isCustomSymbolsValid() && (
                                                <p className="text-[10px] text-rose-500 mt-1 font-semibold">Require at least 3 custom symbols.</p>
                                            )}
                                        </div>
                                    ) : (
                                        <div className={`text-xs px-3 py-2 rounded-xl border font-mono truncate ${t.inputBg}`}>
                                            {defaultSymbols}
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>

                        {/* Local Vault Card */}
                        {Array.isArray(savedPasswords) && savedPasswords.length > 0 && (
                            <div className={`rounded-3xl p-6 sm:p-7 border space-y-3 transition-all ${t.cardBg}`}>
                                <div className="flex items-center justify-between">
                                    <div className="flex items-center space-x-2">
                                        <h3 className="text-lg font-bold tracking-tight">
                                            Local Vault
                                        </h3>
                                        <span className={`text-xs font-mono px-2.5 py-0.5 rounded-full border font-bold ${t.badgeBg} ${t.badgeBorder}`}>
                                            {savedPasswords.length} stored
                                        </span>
                                    </div>
                                    <div className="flex gap-2">
                                        <button
                                            type="button"
                                            onClick={downloadListAsTxt}
                                            className={`px-3.5 py-1.5 text-xs font-bold rounded-xl border transition-all flex items-center space-x-1.5 ${t.btnSecondary}`}
                                        >
                                            <span>Export .txt</span>
                                        </button>
                                        <button
                                            type="button"
                                            onClick={clearList}
                                            className="px-3.5 py-1.5 text-xs font-bold rounded-xl border border-rose-500/30 text-rose-500 hover:bg-rose-500/10 transition-colors"
                                        >
                                            Clear All
                                        </button>
                                    </div>
                                </div>
                                <div className="max-h-56 overflow-y-auto space-y-2 pr-1 custom-scroll">
                                    {savedPasswords.map((item, index) => (
                                        <div key={index} className={`border rounded-2xl px-4 py-2.5 flex items-center justify-between text-xs font-mono transition-all ${t.inputBg}`}>
                                            <span className="truncate mr-4 select-all">{String(item || '')}</span>
                                            <div className="flex items-center space-x-2 shrink-0">
                                                <button
                                                    type="button"
                                                    onClick={() => copyToClipboard(item, index)}
                                                    className={`text-[11px] font-sans px-3 py-1 rounded-xl border font-bold transition-all ${
                                                        copiedVaultIdx === index
                                                            ? 'bg-emerald-600 text-white border-transparent'
                                                            : t.btnSecondary
                                                    }`}
                                                >
                                                    {copiedVaultIdx === index ? '✓ Copied' : 'Copy'}
                                                </button>
                                                <button
                                                    type="button"
                                                    onClick={() => removeSavedItem(index)}
                                                    className="opacity-50 hover:opacity-100 hover:text-rose-500 p-1 rounded-full transition-colors font-bold"
                                                    title="Delete password"
                                                >
                                                    ✕
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* Security Specifications Card */}
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div className={`rounded-3xl p-6 space-y-2 border ${t.subCardBg}`}>
                                <h3 className="text-sm font-bold flex items-center space-x-1.5">
                                    <span>🛡️</span>
                                    <span>Cryptographic Guarantee</span>
                                </h3>
                                <p className={`text-xs leading-relaxed ${t.textMuted}`}>
                                    Entropy is generated via the native browser Web Crypto API (<code className="text-[11px] font-mono px-1 rounded bg-black/10 dark:bg-white/10">crypto.getRandomValues</code>) with uniform Fisher-Yates array permutation.
                                </p>
                            </div>

                            <div className={`rounded-3xl p-6 space-y-2 border ${t.subCardBg}`}>
                                <h3 className="text-sm font-bold flex items-center space-x-1.5">
                                    <span>🔒</span>
                                    <span>Client-Side Privacy</span>
                                </h3>
                                <p className={`text-xs leading-relaxed ${t.textMuted}`}>
                                    100% in-memory client operation. No network packets, telemetry, or generated credentials ever leave your device.
                                </p>
                            </div>
                        </div>
                    </main>

                    {/* Footer */}
                    <footer className={`border-t py-6 text-center text-xs transition-colors ${t.footerBorder}`}>
                        <p className={`font-medium ${t.textMuted}`}>
                            YabadabaPW • Active Palette: <span className="font-bold">{t.name}</span>
                        </p>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
