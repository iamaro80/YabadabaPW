<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YabadabaPW - Custom Rule-Compliant Strong Password Generator</title>
    <!-- Inline SVG Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔐</text></svg>">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    colors: {
                        cwhite: '#FFFFFF',
                        cindigo: '#363671',
                        ccobalt: '#3E5196',
                        crose: '#EE537C',
                        ccoral: '#EB927B',
                        cmint: '#8FC9BF',
                        cslate: '#807E9B',
                        cbg: '#F8F9FD',
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --bg-page: #F8F9FD;
            --card-bg: #FFFFFF;
            --text-main: #363671;
            --text-sub: #807E9B;
            --accent-rose: #EE537C;
            --accent-coral: #EB927B;
            --accent-mint: #8FC9BF;
            --accent-cobalt: #3E5196;
            --border-card: rgba(128, 126, 155, 0.22);
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-page);
            color: var(--text-main);
        }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb {
            background-color: rgba(128, 126, 155, 0.25);
            border-radius: 9999px;
        }
        input[type="range"] {
            accent-color: #EE537C;
        }
    </style>
    <!-- React & ReactDOM Production CDNs -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="h-full antialiased bg-[#F8F9FD] text-[#363671]">
    <div id="root" class="h-full"></div>

    <script type="text/babel">
        function App() {
            const [password, setPassword] = React.useState('');
            const [length, setLength] = React.useState(16);
            const [includeUpper, setIncludeUpper] = React.useState(true);
            const [includeLower, setIncludeLower] = React.useState(true);
            const [includeNumbers, setIncludeNumbers] = React.useState(true);
            const [includeSymbols, setIncludeSymbols] = React.useState(true);
            const [excludeAmbiguous, setExcludeAmbiguous] = React.useState(false);

            // Custom symbols options
            const [symbolMode, setSymbolMode] = React.useState('default');
            const [customSymbols, setCustomSymbols] = React.useState('#@$&%!');

            // Leading character option
            const [leadingChar, setLeadingChar] = React.useState('any');

            const [copied, setCopied] = React.useState(false);
            const [copiedVaultIdx, setCopiedVaultIdx] = React.useState(null);
            const [saveNotification, setSaveNotification] = React.useState(false);

            // Persistent saved passwords vault in localStorage
            const [savedPasswords, setSavedPasswords] = React.useState(() => {
                try {
                    const stored = localStorage.getItem('yabadabapw_saved');
                    return stored ? JSON.parse(stored) : [];
                } catch (e) {
                    return [];
                }
            });

            React.useEffect(() => {
                try {
                    localStorage.setItem('yabadabapw_saved', JSON.stringify(savedPasswords));
                } catch (e) {
                    console.error('Failed to save to localStorage', e);
                }
            }, [savedPasswords]);

            // Character sets
            const uppercaseBase = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            const lowercaseBase = 'abcdefghijklmnopqrstuvwxyz';
            const numberBase = '0123456789';
            const defaultSymbols = '!@#$%^&*()_+-=[]{}|;:,.<>?';
            const ambiguousChars = ['0', 'O', 'o', 'I', 'l', '1', '|', ';', ':'];

            const filterAmbiguous = (str) => {
                if (!excludeAmbiguous) return str;
                return str.split('').filter(c => !ambiguousChars.includes(c)).join('');
            };

            const getActiveSymbols = () => {
                if (symbolMode === 'custom') {
                    return typeof customSymbols === 'string' ? customSymbols : '#@$&%!';
                }
                return defaultSymbols;
            };

            const isCustomSymbolsValid = () => {
                if (symbolMode === 'custom' && includeSymbols) {
                    const s = typeof customSymbols === 'string' ? customSymbols : '';
                    return s.length >= 3;
                }
                return true;
            };

            // Calculate mathematical entropy in bits
            const getStrengthMetrics = () => {
                if (!password || password.startsWith('Error')) {
                    return { bits: 0, label: 'None', width: '0%', color: '#807E9B' };
                }
                let poolSize = 0;
                if (includeUpper) poolSize += filterAmbiguous(uppercaseBase).length;
                if (includeLower) poolSize += filterAmbiguous(lowercaseBase).length;
                if (includeNumbers) poolSize += filterAmbiguous(numberBase).length;
                if (includeSymbols && isCustomSymbolsValid()) poolSize += filterAmbiguous(getActiveSymbols()).length;

                if (poolSize === 0) return { bits: 0, label: 'None', width: '0%', color: '#807E9B' };

                const bits = Math.round(password.length * Math.log2(poolSize));
                if (bits < 36) {
                    return { bits, label: 'Weak', width: '25%', color: '#EB927B' };
                } else if (bits < 60) {
                    return { bits, label: 'Fair', width: '50%', color: '#EB927B' };
                } else if (bits < 80) {
                    return { bits, label: 'Strong', width: '75%', color: '#8FC9BF' };
                } else {
                    return { bits, label: 'Very Strong', width: '100%', color: '#8FC9BF' };
                }
            };

            const generatePassword = React.useCallback(() => {
                if (symbolMode === 'custom' && includeSymbols && !isCustomSymbolsValid()) {
                    setPassword('Error: Custom symbols must have 3+ characters!');
                    return;
                }

                const activeSymbols = filterAmbiguous(getActiveSymbols());
                const activeUpper = filterAmbiguous(uppercaseBase);
                const activeLower = filterAmbiguous(lowercaseBase);
                const activeNumbers = filterAmbiguous(numberBase);

                let charPool = '';
                let requiredCategories = [];

                if (includeUpper && activeUpper.length > 0) {
                    charPool += activeUpper;
                    requiredCategories.push(activeUpper);
                }
                if (includeLower && activeLower.length > 0) {
                    charPool += activeLower;
                    requiredCategories.push(activeLower);
                }
                if (includeNumbers && activeNumbers.length > 0) {
                    charPool += activeNumbers;
                    requiredCategories.push(activeNumbers);
                }
                if (includeSymbols && isCustomSymbolsValid() && activeSymbols.length > 0) {
                    charPool += activeSymbols;
                    requiredCategories.push(activeSymbols);
                }

                if (charPool === '' || requiredCategories.length === 0) {
                    setPassword('Error: Please select at least one character set!');
                    return;
                }

                const effectiveLength = Math.max(length, requiredCategories.length);

                let resultChars = [];
                const randomValues = new Uint32Array(effectiveLength);
                window.crypto.getRandomValues(randomValues);

                // 1. Guarantee at least one character from each selected category
                for (let idx = 0; idx < requiredCategories.length; idx++) {
                    const category = requiredCategories[idx];
                    const randomIndex = randomValues[idx] % category.length;
                    resultChars.push(category[randomIndex]);
                }

                // 2. Fill remainder randomly
                for (let i = resultChars.length; i < effectiveLength; i++) {
                    const randomIndex = randomValues[i] % charPool.length;
                    resultChars.push(charPool[randomIndex]);
                }

                // 3. Cryptographically secure Fisher-Yates shuffle with fresh entropy
                const shuffleEntropy = new Uint32Array(resultChars.length);
                window.crypto.getRandomValues(shuffleEntropy);
                for (let i = resultChars.length - 1; i > 0; i--) {
                    const j = shuffleEntropy[i] % (i + 1);
                    const temp = resultChars[i];
                    resultChars[i] = resultChars[j];
                    resultChars[j] = temp;
                }

                // 4. Enforce Leading Character preference if specified
                if (leadingChar !== 'any') {
                    let targetPool = '';
                    if (leadingChar === 'upper' && includeUpper) targetPool = activeUpper;
                    if (leadingChar === 'lower' && includeLower) targetPool = activeLower;
                    if (leadingChar === 'number' && includeNumbers) targetPool = activeNumbers;
                    if (leadingChar === 'symbol' && includeSymbols && isCustomSymbolsValid()) targetPool = activeSymbols;

                    if (targetPool && targetPool.length > 0) {
                        const matchIndex = resultChars.findIndex(c => targetPool.includes(c));
                        if (matchIndex !== -1) {
                            const temp = resultChars[0];
                            resultChars[0] = resultChars[matchIndex];
                            resultChars[matchIndex] = temp;
                        } else {
                            const leadRand = new Uint32Array(1);
                            window.crypto.getRandomValues(leadRand);
                            resultChars[0] = targetPool[leadRand[0] % targetPool.length];
                        }
                    }
                }

                const finalStr = resultChars.join('');
                setPassword(finalStr);
                setCopied(false);
            }, [length, includeUpper, includeLower, includeNumbers, includeSymbols, excludeAmbiguous, symbolMode, customSymbols, leadingChar]);

            // Auto-generate on configuration change
            React.useEffect(() => {
                generatePassword();
            }, [generatePassword]);

            // Reset leading character if its selected character set becomes disabled
            React.useEffect(() => {
                if (leadingChar === 'upper' && !includeUpper) setLeadingChar('any');
                if (leadingChar === 'lower' && !includeLower) setLeadingChar('any');
                if (leadingChar === 'number' && !includeNumbers) setLeadingChar('any');
                if (leadingChar === 'symbol' && (!includeSymbols || !isCustomSymbolsValid())) setLeadingChar('any');
            }, [includeUpper, includeLower, includeNumbers, includeSymbols, symbolMode, customSymbols, leadingChar]);

            const copyToClipboard = (textToCopy, isVaultIdx = null) => {
                const str = typeof textToCopy === 'string' ? textToCopy : String(textToCopy || '');
                if (!str || str.startsWith('Error')) return;

                const onSuccess = () => {
                    if (isVaultIdx !== null) {
                        setCopiedVaultIdx(isVaultIdx);
                        setTimeout(() => setCopiedVaultIdx(null), 1500);
                    } else {
                        setCopied(true);
                        setTimeout(() => setCopied(false), 2000);
                    }
                };

                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(str).then(onSuccess).catch(() => fallbackCopy(str, onSuccess));
                } else {
                    fallbackCopy(str, onSuccess);
                }
            };

            const fallbackCopy = (str, cb) => {
                const textArea = document.createElement("textarea");
                textArea.value = str;
                textArea.style.position = "fixed";
                textArea.style.opacity = "0";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                try {
                    document.execCommand('copy');
                    if (cb) cb();
                } catch (err) {
                    console.error('Fallback copy failed', err);
                }
                document.body.removeChild(textArea);
            };

            const saveToList = () => {
                const pwdStr = typeof password === 'string' ? password : String(password || '');
                if (!pwdStr || pwdStr.startsWith('Error')) return;
                if (!savedPasswords.includes(pwdStr)) {
                    setSavedPasswords([pwdStr, ...savedPasswords]);
                    setSaveNotification(true);
                    setTimeout(() => setSaveNotification(false), 2000);
                }
            };

            const removeSavedItem = (indexToRemove) => {
                setSavedPasswords(savedPasswords.filter((_, idx) => idx !== indexToRemove));
            };

            const clearList = () => {
                if (window.confirm('Are you sure you want to clear your local vault?')) {
                    setSavedPasswords([]);
                }
            };

            const downloadListAsTxt = () => {
                if (!Array.isArray(savedPasswords) || savedPasswords.length === 0) return;
                const fileContent = `# YabadabaPW Vault Export\n# Exported on ${new Date().toLocaleString()}\n\n` + savedPasswords.join('\n');
                const blob = new Blob([fileContent], { type: 'text/plain;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `yabadabapw-vault-${new Date().toISOString().slice(0, 10)}.txt`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
            };

            // Quick preset handler
            const applyPreset = (presetName) => {
                if (presetName === 'standard') {
                    setLength(16);
                    setIncludeUpper(true);
                    setIncludeLower(true);
                    setIncludeNumbers(true);
                    setIncludeSymbols(true);
                    setExcludeAmbiguous(false);
                    setLeadingChar('any');
                } else if (presetName === 'pin') {
                    setLength(6);
                    setIncludeUpper(false);
                    setIncludeLower(false);
                    setIncludeNumbers(true);
                    setIncludeSymbols(false);
                    setExcludeAmbiguous(false);
                    setLeadingChar('any');
                } else if (presetName === 'alphanumeric') {
                    setLength(20);
                    setIncludeUpper(true);
                    setIncludeLower(true);
                    setIncludeNumbers(true);
                    setIncludeSymbols(false);
                    setExcludeAmbiguous(true);
                    setLeadingChar('any');
                } else if (presetName === 'maximum') {
                    setLength(32);
                    setIncludeUpper(true);
                    setIncludeLower(true);
                    setIncludeNumbers(true);
                    setIncludeSymbols(true);
                    setExcludeAmbiguous(false);
                    setLeadingChar('upper');
                }
            };

            const strength = getStrengthMetrics();
            const isError = !password || password.startsWith('Error');

            return (
                <div className="bg-[#F8F9FD] text-[#363671] min-h-full flex flex-col justify-between font-sans">
                    
                    {/* Top App Bar */}
                    <header className="border-b border-[#807E9B]/20 bg-white/95 sticky top-0 z-20 backdrop-blur-md">
                        <div className="max-w-4xl mx-auto px-6 py-4 flex flex-col sm:flex-row items-center justify-between gap-3 sm:gap-0">
                            <div className="flex items-center space-x-3.5">
                                <div className="w-10 h-10 rounded-2xl bg-[#363671] text-white flex items-center justify-center font-bold text-lg shadow-sm">
                                    YP
                                </div>
                                <div>
                                    <h1 className="text-xl font-bold tracking-tight text-[#363671]">
                                        YabadabaPW
                                    </h1>
                                    <p className="text-[11px] font-medium text-[#807E9B]">
                                        Custom Rule-Compliant Strong Password Generator
                                    </p>
                                </div>
                            </div>

                        </div>
                    </header>

                    {/* Main Content Area */}
                    <main className="max-w-3xl mx-auto px-6 py-8 w-full flex-grow space-y-6">
                        
                        {/* Quick Presets Pills */}
                        <div className="flex flex-wrap items-center justify-between gap-2 bg-white border border-[#807E9B]/20 rounded-2xl px-4 py-3 shadow-[0_2px_10px_rgba(54,54,113,0.04)]">
                            <span className="text-[11px] font-bold uppercase tracking-wider text-[#807E9B]">Quick Profiles:</span>
                            <div className="flex flex-wrap gap-1.5">
                                <button
                                    type="button"
                                    onClick={() => applyPreset('standard')}
                                    className="px-3 py-1 rounded-xl text-xs font-bold transition-all bg-[#F8F9FD] hover:bg-[#EEF1F8] border border-[#807E9B]/30 text-[#363671]"
                                >
                                    Standard 16
                                </button>
                                <button
                                    type="button"
                                    onClick={() => applyPreset('alphanumeric')}
                                    className="px-3 py-1 rounded-xl text-xs font-bold transition-all bg-[#F8F9FD] hover:bg-[#EEF1F8] border border-[#807E9B]/30 text-[#363671]"
                                >
                                    URL-Safe 20
                                </button>
                                <button
                                    type="button"
                                    onClick={() => applyPreset('maximum')}
                                    className="px-3 py-1 rounded-xl text-xs font-bold transition-all bg-[#F8F9FD] hover:bg-[#EEF1F8] border border-[#807E9B]/30 text-[#363671]"
                                >
                                    High Security 32
                                </button>
                                <button
                                    type="button"
                                    onClick={() => applyPreset('pin')}
                                    className="px-3 py-1 rounded-xl text-xs font-bold transition-all bg-[#F8F9FD] hover:bg-[#EEF1F8] border border-[#807E9B]/30 text-[#363671]"
                                >
                                    PIN (6 Digits)
                                </button>
                            </div>
                        </div>

                        {/* Password Viewport Card */}
                        <div className="bg-white border border-[#807E9B]/20 rounded-3xl p-6 sm:p-7 shadow-[0_10px_30px_rgba(54,54,113,0.06)] space-y-4">
                            <div className="flex justify-between items-center text-xs">
                                <div className="flex items-center space-x-2">
                                    <span className="w-2 h-2 rounded-full bg-[#EE537C]"></span>
                                    <label className="text-xs font-bold uppercase tracking-wider text-[#807E9B]">
                                        Generated Password
                                    </label>
                                </div>
                                {!isError && (
                                    <div className="px-3 py-1 rounded-full text-xs font-bold border border-[#8FC9BF] bg-[#8FC9BF]/20 text-[#363671] flex items-center space-x-1.5 shadow-sm">
                                        <span className="w-1.5 h-1.5 rounded-full bg-[#8FC9BF] inline-block"></span>
                                        <span className="font-mono text-xs">{strength.bits} BITS</span>
                                        <span className="opacity-40">•</span>
                                        <span>{strength.label}</span>
                                    </div>
                                )}
                            </div>

                            {/* Password Box & Actions */}
                            <div className="flex flex-col sm:flex-row items-stretch sm:items-center gap-3">
                                <div 
                                    className={`rounded-2xl px-5 py-4 font-mono text-xl sm:text-2xl font-bold tracking-wider flex-grow select-all break-all border transition-colors ${
                                        isError
                                            ? 'border-rose-500/50 text-rose-500 bg-rose-50'
                                            : 'bg-[#F8F9FD] border-[#807E9B]/30 text-[#363671] shadow-inner'
                                    }`}
                                >
                                    {String(password || '')}
                                </div>
                                <div className="flex gap-2 shrink-0">
                                    <button
                                        onClick={() => copyToClipboard(password)}
                                        disabled={isError}
                                        className={`px-6 py-4 font-bold text-xs uppercase tracking-wider rounded-2xl transition-all flex items-center justify-center space-x-2 shadow-[0_4px_14px_rgba(238,83,124,0.35)] ${
                                            isError
                                                ? 'opacity-40 cursor-not-allowed bg-zinc-200 text-zinc-400'
                                                : copied 
                                                    ? 'bg-emerald-600 text-white shadow-none' 
                                                    : 'bg-[#EE537C] hover:bg-[#DE3F68] text-white active:scale-95'
                                        }`}
                                    >
                                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            {copied ? (
                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M5 13l4 4L19 7"/>
                                            ) : (
                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"/>
                                            )}
                                        </svg>
                                        <span>{copied ? 'Copied' : 'Copy'}</span>
                                    </button>

                                    <button
                                        onClick={saveToList}
                                        disabled={isError}
                                        className="p-4 rounded-2xl border-2 border-[#363671] text-[#363671] bg-white hover:bg-[#F8F9FD] transition-all flex items-center justify-center shadow-sm disabled:opacity-40 disabled:cursor-not-allowed"
                                        title="Save password to vault"
                                    >
                                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.2" d="M12 4v16m8-8H4"/>
                                        </svg>
                                    </button>

                                    <button
                                        onClick={generatePassword}
                                        className="p-4 rounded-2xl border border-[#807E9B]/30 text-[#3E5196] bg-white hover:bg-[#F8F9FD] transition-all flex items-center justify-center shadow-sm active:rotate-180 duration-500"
                                        title="Generate new key"
                                    >
                                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                                        </svg>
                                    </button>
                                </div>
                            </div>

                            {/* Dual Gauge Bar (Colorion Team Health Inspiration) */}
                            {!isError && (
                                <div className="space-y-1.5 pt-1">
                                    <div className="w-full bg-[#EBF0F5] h-2 rounded-full overflow-hidden">
                                        <div 
                                            className="h-full transition-all duration-300 rounded-full"
                                            style={{ width: strength.width, background: '#8FC9BF' }}
                                        />
                                    </div>
                                    <div className="w-2/3 bg-[#EBF0F5] h-1.5 rounded-full overflow-hidden">
                                        <div 
                                            className="h-full transition-all duration-300 rounded-full"
                                            style={{ width: `${Math.min(100, Math.round((length / 32) * 100))}%`, background: '#EE537C' }}
                                        />
                                    </div>
                                </div>
                            )}

                            {saveNotification && (
                                <p className="text-xs font-semibold mt-3 text-emerald-600 flex items-center space-x-1">
                                    <span>✓</span>
                                    <span>Preserved in your local vault below.</span>
                                </p>
                            )}
                        </div>

                        {/* Configuration Dashboard Card */}
                        <div className="bg-white border border-[#807E9B]/20 rounded-3xl p-6 sm:p-7 shadow-[0_10px_30px_rgba(54,54,113,0.06)] space-y-6">
                            
                            {/* Length Slider & Quick Preset Chips */}
                            <div className="space-y-3">
                                <div className="flex justify-between items-center text-xs font-bold uppercase tracking-wider">
                                    <span className="text-[#807E9B]">
                                        Password Length
                                    </span>
                                    <div className="flex items-center space-x-2">
                                        <div className="flex space-x-1 font-mono">
                                            {[12, 16, 24, 32].map((preset) => (
                                                <button
                                                    key={preset}
                                                    type="button"
                                                    onClick={() => setLength(preset)}
                                                    className={`px-2.5 py-1 rounded-lg text-xs font-bold transition-all border ${
                                                        length === preset 
                                                            ? 'bg-[#363671] text-white border-[#363671]' 
                                                            : 'bg-[#F8F9FD] text-[#363671] border-[#807E9B]/30 hover:bg-[#EEF1F8]'
                                                    }`}
                                                >
                                                    {preset}
                                                </button>
                                            ))}
                                        </div>
                                        <span className="font-mono px-3 py-1 rounded-full border border-[#807E9B]/30 bg-[#F8F9FD] text-[#363671] text-xs font-bold">
                                            {String(length)} Chars
                                        </span>
                                    </div>
                                </div>
                                <input
                                    type="range"
                                    min="8"
                                    max="64"
                                    value={length}
                                    onChange={(e) => setLength(parseInt(e.target.value, 10))}
                                    className="w-full h-2 rounded-lg appearance-none cursor-pointer bg-[#F8F9FD]"
                                />
                                <div className="flex justify-between text-[11px] font-mono text-[#807E9B]">
                                    <span>8</span>
                                    <span>24</span>
                                    <span>40</span>
                                    <span>64</span>
                                </div>
                            </div>

                            <hr className="border-t border-[#807E9B]/20" />

                            {/* Character Set Toggles */}
                            <div className="space-y-3">
                                <label className="text-xs font-bold uppercase tracking-wider block text-[#807E9B]">
                                    Character Sets
                                </label>
                                <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
                                    <label className={`flex items-center space-x-2.5 p-3.5 rounded-2xl border-2 cursor-pointer transition-all ${
                                        includeUpper 
                                            ? 'border-[#363671] bg-[#F8F9FD] text-[#363671] font-bold shadow-sm' 
                                            : 'border-[#807E9B]/30 bg-white text-[#807E9B]'
                                    }`}>
                                        <input type="checkbox" checked={includeUpper} onChange={(e) => setIncludeUpper(e.target.checked)} className="rounded accent-[#363671]"/>
                                        <span className="text-xs">Uppercase</span>
                                    </label>
                                    <label className={`flex items-center space-x-2.5 p-3.5 rounded-2xl border-2 cursor-pointer transition-all ${
                                        includeLower 
                                            ? 'border-[#363671] bg-[#F8F9FD] text-[#363671] font-bold shadow-sm' 
                                            : 'border-[#807E9B]/30 bg-white text-[#807E9B]'
                                    }`}>
                                        <input type="checkbox" checked={includeLower} onChange={(e) => setIncludeLower(e.target.checked)} className="rounded accent-[#363671]"/>
                                        <span className="text-xs">Lowercase</span>
                                    </label>
                                    <label className={`flex items-center space-x-2.5 p-3.5 rounded-2xl border-2 cursor-pointer transition-all ${
                                        includeNumbers 
                                            ? 'border-[#363671] bg-[#F8F9FD] text-[#363671] font-bold shadow-sm' 
                                            : 'border-[#807E9B]/30 bg-white text-[#807E9B]'
                                    }`}>
                                        <input type="checkbox" checked={includeNumbers} onChange={(e) => setIncludeNumbers(e.target.checked)} className="rounded accent-[#363671]"/>
                                        <span className="text-xs">Numbers</span>
                                    </label>
                                    <label className={`flex items-center space-x-2.5 p-3.5 rounded-2xl border-2 cursor-pointer transition-all ${
                                        includeSymbols 
                                            ? 'border-[#363671] bg-[#F8F9FD] text-[#363671] font-bold shadow-sm' 
                                            : 'border-[#807E9B]/30 bg-white text-[#807E9B]'
                                    }`}>
                                        <input type="checkbox" checked={includeSymbols} onChange={(e) => setIncludeSymbols(e.target.checked)} className="rounded accent-[#363671]"/>
                                        <span className="text-xs">Symbols</span>
                                    </label>
                                </div>
                            </div>

                            {/* Ambiguous Chars Toggle */}
                            <div>
                                <label className={`flex items-center space-x-2.5 p-3.5 rounded-2xl border cursor-pointer transition-all ${
                                    excludeAmbiguous 
                                        ? 'border-[#363671] bg-[#F8F9FD] text-[#363671] shadow-sm' 
                                        : 'border-[#807E9B]/30 bg-white text-[#807E9B]'
                                }`}>
                                    <input 
                                        type="checkbox" 
                                        checked={excludeAmbiguous} 
                                        onChange={(e) => setExcludeAmbiguous(e.target.checked)} 
                                        className="rounded accent-[#363671]"
                                    />
                                    <div className="text-xs">
                                        <span className="font-bold text-[#363671]">Exclude Ambiguous Characters</span>
                                        <span className="block text-[11px] font-mono mt-0.5 text-[#807E9B]">
                                            Filters out visually confusing chars (0, O, o, 1, l, I, |, ;, :)
                                        </span>
                                    </div>
                                </label>
                            </div>

                            {/* Leading Char & Custom Symbols Row */}
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-1">
                                <div className="border border-[#807E9B]/30 bg-[#F8F9FD] rounded-2xl p-4 space-y-2">
                                    <label className="text-xs font-bold uppercase tracking-wider block text-[#807E9B]">
                                        Start With (Leading Character)
                                    </label>
                                    <select
                                        value={leadingChar}
                                        onChange={(e) => setLeadingChar(e.target.value)}
                                        className="w-full bg-white border border-[#807E9B]/30 rounded-xl px-3 py-2 text-xs font-bold text-[#363671] focus:outline-none"
                                    >
                                        <option value="any">Any (Random Start)</option>
                                        <option value="upper" disabled={!includeUpper}>Uppercase Letter (A-Z)</option>
                                        <option value="lower" disabled={!includeLower}>Lowercase Letter (a-z)</option>
                                        <option value="number" disabled={!includeNumbers}>Number (0-9)</option>
                                        <option value="symbol" disabled={!includeSymbols || !isCustomSymbolsValid()}>Symbol</option>
                                    </select>
                                </div>

                                <div className="border border-[#807E9B]/30 bg-[#F8F9FD] rounded-2xl p-4 space-y-2">
                                    <div className="flex justify-between items-center">
                                        <label className="text-xs font-bold uppercase tracking-wider text-[#807E9B]">
                                            Custom Allowed Symbols
                                        </label>
                                        <div className="flex space-x-1 text-[11px]">
                                            <button 
                                                type="button"
                                                onClick={() => setSymbolMode('default')} 
                                                className={`px-2.5 py-0.5 rounded-full border transition-all text-xs font-bold ${
                                                    symbolMode === 'default' 
                                                        ? 'bg-[#363671] text-white border-[#363671]' 
                                                        : 'border-transparent text-[#807E9B] hover:text-[#363671]'
                                                }`}
                                            >
                                                Default
                                            </button>
                                            <button 
                                                type="button"
                                                onClick={() => setSymbolMode('custom')} 
                                                className={`px-2.5 py-0.5 rounded-full border transition-all text-xs font-bold ${
                                                    symbolMode === 'custom' 
                                                        ? 'bg-[#363671] text-white border-[#363671]' 
                                                        : 'border-transparent text-[#807E9B] hover:text-[#363671]'
                                                }`}
                                            >
                                                Custom
                                            </button>
                                        </div>
                                    </div>
                                    {symbolMode === 'custom' ? (
                                        <div>
                                            <input
                                                type="text"
                                                value={customSymbols}
                                                onChange={(e) => setCustomSymbols(e.target.value)}
                                                placeholder="Enter at least 3 symbols"
                                                className={`w-full bg-white border rounded-xl px-3 py-2 text-xs font-mono text-[#363671] focus:outline-none ${
                                                    !isCustomSymbolsValid() ? 'border-rose-500' : 'border-[#807E9B]/30'
                                                }`}
                                            />
                                            {!isCustomSymbolsValid() ? (
                                                <p className="text-[10px] text-rose-500 mt-1 font-semibold">Require at least 3 custom symbols.</p>
                                            ) : (
                                                <div className="mt-1 flex items-center gap-1.5">
                                                    <span className="text-[10px] font-bold px-2 py-0.5 rounded" style={{ background: '#FEECE7', color: '#C85942' }}>
                                                        #EB927B Custom Active
                                                    </span>
                                                </div>
                                            )}
                                        </div>
                                    ) : (
                                        <div className="text-xs px-3 py-2 rounded-xl border border-[#807E9B]/30 bg-white font-mono text-[#363671] truncate">
                                            {defaultSymbols}
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>

                        {/* Local Vault Card */}
                        {Array.isArray(savedPasswords) && savedPasswords.length > 0 && (
                            <div className="bg-white border border-[#807E9B]/20 rounded-3xl p-6 sm:p-7 shadow-[0_10px_30px_rgba(54,54,113,0.06)] space-y-3">
                                <div className="flex items-center justify-between">
                                    <div className="flex items-center space-x-2">
                                        <h3 className="text-lg font-bold tracking-tight text-[#363671]">
                                            Local Vault
                                        </h3>
                                        <span className="text-xs font-mono px-2.5 py-0.5 rounded-full border border-[#8FC9BF] bg-[#8FC9BF]/20 text-[#363671] font-bold">
                                            {savedPasswords.length} stored
                                        </span>
                                    </div>
                                    <div className="flex gap-2">
                                        <button
                                            type="button"
                                            onClick={downloadListAsTxt}
                                            className="px-3.5 py-1.5 text-xs font-bold rounded-xl border border-[#807E9B]/30 bg-white hover:bg-[#F8F9FD] text-[#363671] transition-all flex items-center space-x-1.5"
                                        >
                                            <span>Export .txt</span>
                                        </button>
                                        <button
                                            type="button"
                                            onClick={clearList}
                                            className="px-3.5 py-1.5 text-xs font-bold rounded-xl border border-rose-500/30 text-rose-500 hover:bg-rose-50 transition-colors"
                                        >
                                            Clear All
                                        </button>
                                    </div>
                                </div>
                                <div className="max-h-56 overflow-y-auto space-y-2 pr-1 custom-scroll">
                                    {savedPasswords.map((item, index) => (
                                        <div key={index} className="border border-[#807E9B]/20 bg-[#F8F9FD] rounded-2xl px-4 py-2.5 flex items-center justify-between text-xs font-mono transition-all">
                                            <span className="truncate mr-4 select-all text-[#363671]">{String(item || '')}</span>
                                            <div className="flex items-center space-x-2 shrink-0">
                                                <button
                                                    type="button"
                                                    onClick={() => copyToClipboard(item, index)}
                                                    className={`text-[11px] font-sans px-3 py-1 rounded-xl border font-bold transition-all ${
                                                        copiedVaultIdx === index
                                                            ? 'bg-emerald-600 text-white border-transparent'
                                                            : 'bg-white hover:bg-[#F8F9FD] border-[#807E9B]/30 text-[#363671]'
                                                    }`}
                                                >
                                                    {copiedVaultIdx === index ? '✓ Copied' : 'Copy'}
                                                </button>
                                                <button
                                                    type="button"
                                                    onClick={() => removeSavedItem(index)}
                                                    className="opacity-50 hover:opacity-100 hover:text-rose-500 p-1 rounded-full transition-colors font-bold text-[#807E9B]"
                                                    title="Delete password"
                                                >
                                                    ✕
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* Security Specifications Card */}
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div className="bg-white border border-[#807E9B]/20 rounded-3xl p-6 space-y-2 shadow-[0_4px_16px_rgba(54,54,113,0.04)]">
                                <h3 className="text-sm font-bold text-[#363671] flex items-center space-x-1.5">
                                    <span>🛡️</span>
                                    <span>Cryptographic Guarantee</span>
                                </h3>
                                <p className="text-xs leading-relaxed text-[#807E9B]">
                                    Entropy is generated via the native browser Web Crypto API (<code className="text-[11px] font-mono px-1 rounded bg-[#F8F9FD] text-[#363671] border border-[#807E9B]/20">crypto.getRandomValues</code>) with uniform Fisher-Yates array permutation.
                                </p>
                            </div>

                            <div className="bg-white border border-[#807E9B]/20 rounded-3xl p-6 space-y-2 shadow-[0_4px_16px_rgba(54,54,113,0.04)]">
                                <h3 className="text-sm font-bold text-[#363671] flex items-center space-x-1.5">
                                    <span>🔒</span>
                                    <span>Client-Side Privacy</span>
                                </h3>
                                <p className="text-xs leading-relaxed text-[#807E9B]">
                                    100% in-memory client operation. No network packets, telemetry, or generated credentials ever leave your device.
                                </p>
                            </div>
                        </div>
                    </main>

                    {/* Footer */}
                    <footer className="border-t border-[#807E9B]/20 py-6 text-center text-xs bg-white/60">
                        <p className="font-medium text-[#807E9B]">
                            YabadabaPW • 100% Client-Side Cryptographic Security
                        </p>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
