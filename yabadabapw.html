<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YabadabaPW - Custom Rule-Compliant Strong Password Generator</title>
    <!-- Inline SVG Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔐</text></svg>">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Cormorant Garamond, Plus Jakarta Sans, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['"Cormorant Garamond"', 'serif'],
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    colors: {
                        champagne: {
                            50: '#FDFBF9',
                            100: '#FAF6F1',
                            200: '#F4ECE4',
                            300: '#E8DCD1',
                            400: '#D5C4B4',
                            500: '#C2AC9A',
                            600: '#A9917D',
                            700: '#8A7360',
                            800: '#695546',
                            900: '#4A3B30',
                        },
                        obsidian: {
                            50: '#F7F6F6',
                            100: '#EBE9E8',
                            200: '#D4D0CE',
                            300: '#ABA4A1',
                            400: '#7E7672',
                            500: '#5C5450',
                            600: '#453E3B',
                            700: '#342E2C',
                            800: '#262220',
                            900: '#1A1716',
                            950: '#12100F',
                        }
                    },
                    boxShadow: {
                        'sculptural-light': '0 12px 32px -6px rgba(184, 160, 142, 0.16), 0 4px 12px -2px rgba(184, 160, 142, 0.08)',
                        'sculptural-dark': '0 14px 38px -8px rgba(0, 0, 0, 0.55), 0 4px 16px -2px rgba(0, 0, 0, 0.35)',
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .font-luxury-serif { font-family: 'Cormorant Garamond', Georgia, serif; }
        
        /* Custom smooth scrollbar */
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb {
            background-color: rgba(180, 160, 145, 0.3);
            border-radius: 9999px;
        }
    </style>
    <!-- React & ReactDOM Production CDNs -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="h-full antialiased transition-colors duration-300">
    <div id="root" class="h-full"></div>

    <script type="text/babel">
        function App() {
            // Theme state with localStorage persistence and system preference fallback
            const [isDarkMode, setIsDarkMode] = React.useState(() => {
                try {
                    const saved = localStorage.getItem('yabadabapw_theme');
                    if (saved !== null) return saved === 'obsidian';
                    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                } catch (e) {
                    return false;
                }
            });

            // Synchronize dark class on HTML root and update body background
            React.useEffect(() => {
                try {
                    if (isDarkMode) {
                        document.documentElement.classList.add('dark');
                        document.body.classList.add('bg-obsidian-950');
                        document.body.classList.remove('bg-[#F5EFEB]');
                    } else {
                        document.documentElement.classList.remove('dark');
                        document.body.classList.remove('bg-obsidian-950');
                        document.body.classList.add('bg-[#F5EFEB]');
                    }
                    localStorage.setItem('yabadabapw_theme', isDarkMode ? 'obsidian' : 'champagne');
                } catch (e) {
                    console.error('Failed to sync theme', e);
                }
            }, [isDarkMode]);

            const [password, setPassword] = React.useState('');
            const [length, setLength] = React.useState(16);
            const [includeUpper, setIncludeUpper] = React.useState(true);
            const [includeLower, setIncludeLower] = React.useState(true);
            const [includeNumbers, setIncludeNumbers] = React.useState(true);
            const [includeSymbols, setIncludeSymbols] = React.useState(true);
            const [excludeAmbiguous, setExcludeAmbiguous] = React.useState(false);

            // Custom symbols options
            const [symbolMode, setSymbolMode] = React.useState('default');
            const [customSymbols, setCustomSymbols] = React.useState('#@$&%!');

            // Leading character option
            const [leadingChar, setLeadingChar] = React.useState('any');

            const [copied, setCopied] = React.useState(false);
            const [copiedVaultIdx, setCopiedVaultIdx] = React.useState(null);
            const [saveNotification, setSaveNotification] = React.useState(false);

            // Persistent saved passwords vault in localStorage
            const [savedPasswords, setSavedPasswords] = React.useState(() => {
                try {
                    const stored = localStorage.getItem('yabadabapw_saved');
                    return stored ? JSON.parse(stored) : [];
                } catch (e) {
                    return [];
                }
            });

            React.useEffect(() => {
                try {
                    localStorage.setItem('yabadabapw_saved', JSON.stringify(savedPasswords));
                } catch (e) {
                    console.error('Failed to save to localStorage', e);
                }
            }, [savedPasswords]);

            // Character sets
            const uppercaseBase = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            const lowercaseBase = 'abcdefghijklmnopqrstuvwxyz';
            const numberBase = '0123456789';
            const defaultSymbols = '!@#$%^&*()_+-=[]{}|;:,.<>?';
            const ambiguousChars = ['0', 'O', 'o', 'I', 'l', '1', '|', ';', ':'];

            const filterAmbiguous = (str) => {
                if (!excludeAmbiguous) return str;
                return str.split('').filter(c => !ambiguousChars.includes(c)).join('');
            };

            const getActiveSymbols = () => {
                if (symbolMode === 'custom') {
                    return typeof customSymbols === 'string' ? customSymbols : '#@$&%!';
                }
                return defaultSymbols;
            };

            const isCustomSymbolsValid = () => {
                if (symbolMode === 'custom' && includeSymbols) {
                    const s = typeof customSymbols === 'string' ? customSymbols : '';
                    return s.length >= 3;
                }
                return true;
            };

            // Calculate mathematical entropy in bits and assign luxury tier
            const getStrengthMetrics = () => {
                if (!password || password.startsWith('Error')) {
                    return { bits: 0, label: 'None', width: '0%' };
                }
                let poolSize = 0;
                if (includeUpper) poolSize += filterAmbiguous(uppercaseBase).length;
                if (includeLower) poolSize += filterAmbiguous(lowercaseBase).length;
                if (includeNumbers) poolSize += filterAmbiguous(numberBase).length;
                if (includeSymbols && isCustomSymbolsValid()) poolSize += filterAmbiguous(getActiveSymbols()).length;

                if (poolSize === 0) return { bits: 0, label: 'None', width: '0%' };

                const bits = Math.round(password.length * Math.log2(poolSize));
                if (bits < 36) {
                    return { bits, label: 'Weak', width: '25%' };
                } else if (bits < 60) {
                    return { bits, label: 'Fair', width: '50%' };
                } else if (bits < 80) {
                    return { bits, label: 'Strong', width: '75%' };
                } else {
                    return { bits, label: 'Very Strong', width: '100%' };
                }
            };

            const generatePassword = React.useCallback(() => {
                if (symbolMode === 'custom' && includeSymbols && !isCustomSymbolsValid()) {
                    setPassword('Error: Custom symbols must have 3+ characters!');
                    return;
                }

                const activeSymbols = filterAmbiguous(getActiveSymbols());
                const activeUpper = filterAmbiguous(uppercaseBase);
                const activeLower = filterAmbiguous(lowercaseBase);
                const activeNumbers = filterAmbiguous(numberBase);

                let charPool = '';
                let requiredCategories = [];

                if (includeUpper && activeUpper.length > 0) {
                    charPool += activeUpper;
                    requiredCategories.push(activeUpper);
                }
                if (includeLower && activeLower.length > 0) {
                    charPool += activeLower;
                    requiredCategories.push(activeLower);
                }
                if (includeNumbers && activeNumbers.length > 0) {
                    charPool += activeNumbers;
                    requiredCategories.push(activeNumbers);
                }
                if (includeSymbols && isCustomSymbolsValid() && activeSymbols.length > 0) {
                    charPool += activeSymbols;
                    requiredCategories.push(activeSymbols);
                }

                if (charPool === '' || requiredCategories.length === 0) {
                    setPassword('Error: Please select at least one character set!');
                    return;
                }

                const effectiveLength = Math.max(length, requiredCategories.length);

                let resultChars = [];
                const randomValues = new Uint32Array(effectiveLength);
                window.crypto.getRandomValues(randomValues);

                // 1. Guarantee at least one character from each selected category
                for (let idx = 0; idx < requiredCategories.length; idx++) {
                    const category = requiredCategories[idx];
                    const randomIndex = randomValues[idx] % category.length;
                    resultChars.push(category[randomIndex]);
                }

                // 2. Fill remainder of password length randomly from the combined pool
                for (let i = resultChars.length; i < effectiveLength; i++) {
                    const randomIndex = randomValues[i] % charPool.length;
                    resultChars.push(charPool[randomIndex]);
                }

                // 3. Cryptographically secure Fisher-Yates shuffle with fresh entropy
                const shuffleEntropy = new Uint32Array(resultChars.length);
                window.crypto.getRandomValues(shuffleEntropy);
                for (let i = resultChars.length - 1; i > 0; i--) {
                    const j = shuffleEntropy[i] % (i + 1);
                    const temp = resultChars[i];
                    resultChars[i] = resultChars[j];
                    resultChars[j] = temp;
                }

                // 4. Enforce Leading Character preference if specified
                if (leadingChar !== 'any') {
                    let targetPool = '';
                    if (leadingChar === 'upper' && includeUpper) targetPool = activeUpper;
                    if (leadingChar === 'lower' && includeLower) targetPool = activeLower;
                    if (leadingChar === 'number' && includeNumbers) targetPool = activeNumbers;
                    if (leadingChar === 'symbol' && includeSymbols && isCustomSymbolsValid()) targetPool = activeSymbols;

                    if (targetPool && targetPool.length > 0) {
                        const matchIndex = resultChars.findIndex(c => targetPool.includes(c));
                        if (matchIndex !== -1) {
                            const temp = resultChars[0];
                            resultChars[0] = resultChars[matchIndex];
                            resultChars[matchIndex] = temp;
                        } else {
                            const leadRand = new Uint32Array(1);
                            window.crypto.getRandomValues(leadRand);
                            resultChars[0] = targetPool[leadRand[0] % targetPool.length];
                        }
                    }
                }

                const finalStr = resultChars.join('');
                setPassword(finalStr);
                setCopied(false);
            }, [length, includeUpper, includeLower, includeNumbers, includeSymbols, excludeAmbiguous, symbolMode, customSymbols, leadingChar]);

            // Auto-generate on configuration change
            React.useEffect(() => {
                generatePassword();
            }, [generatePassword]);

            // Reset leading character if its selected character set becomes disabled
            React.useEffect(() => {
                if (leadingChar === 'upper' && !includeUpper) setLeadingChar('any');
                if (leadingChar === 'lower' && !includeLower) setLeadingChar('any');
                if (leadingChar === 'number' && !includeNumbers) setLeadingChar('any');
                if (leadingChar === 'symbol' && (!includeSymbols || !isCustomSymbolsValid())) setLeadingChar('any');
            }, [includeUpper, includeLower, includeNumbers, includeSymbols, symbolMode, customSymbols, leadingChar]);

            const copyToClipboard = (textToCopy, isVaultIdx = null) => {
                const str = typeof textToCopy === 'string' ? textToCopy : String(textToCopy || '');
                if (!str || str.startsWith('Error')) return;

                const onSuccess = () => {
                    if (isVaultIdx !== null) {
                        setCopiedVaultIdx(isVaultIdx);
                        setTimeout(() => setCopiedVaultIdx(null), 1500);
                    } else {
                        setCopied(true);
                        setTimeout(() => setCopied(false), 2000);
                    }
                };

                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(str).then(onSuccess).catch(() => fallbackCopy(str, onSuccess));
                } else {
                    fallbackCopy(str, onSuccess);
                }
            };

            const fallbackCopy = (str, cb) => {
                const textArea = document.createElement("textarea");
                textArea.value = str;
                textArea.style.position = "fixed";
                textArea.style.opacity = "0";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                try {
                    document.execCommand('copy');
                    if (cb) cb();
                } catch (err) {
                    console.error('Fallback copy failed', err);
                }
                document.body.removeChild(textArea);
            };

            const saveToList = () => {
                const pwdStr = typeof password === 'string' ? password : String(password || '');
                if (!pwdStr || pwdStr.startsWith('Error')) return;
                if (!savedPasswords.includes(pwdStr)) {
                    setSavedPasswords([pwdStr, ...savedPasswords]);
                    setSaveNotification(true);
                    setTimeout(() => setSaveNotification(false), 2000);
                }
            };

            const removeSavedItem = (indexToRemove) => {
                setSavedPasswords(savedPasswords.filter((_, idx) => idx !== indexToRemove));
            };

            const clearList = () => {
                if (window.confirm('Are you sure you want to clear your local vault?')) {
                    setSavedPasswords([]);
                }
            };

            const downloadListAsTxt = () => {
                if (!Array.isArray(savedPasswords) || savedPasswords.length === 0) return;
                const fileContent = `# YabadabaPW Vault Export\n# Exported on ${new Date().toLocaleString()}\n\n` + savedPasswords.join('\n');
                const blob = new Blob([fileContent], { type: 'text/plain;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `yabadabapw-vault-${new Date().toISOString().slice(0, 10)}.txt`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
            };

            const strength = getStrengthMetrics();
            const isError = !password || password.startsWith('Error');

            return (
                <div className={`${isDarkMode ? 'dark bg-obsidian-950 text-champagne-100' : 'bg-[#F5EFEB] text-obsidian-800'} min-h-full flex flex-col justify-between transition-colors duration-300 font-sans`}>
                    
                    {/* Top App Bar (Champagne Travertine / Obsidian Basalt) */}
                    <header className={`border-b ${isDarkMode ? 'border-obsidian-800 bg-obsidian-900/90' : 'border-champagne-300/70 bg-[#FAF6F0]/90'} sticky top-0 z-20 backdrop-blur-md transition-colors`}>
                        <div className="max-w-4xl mx-auto px-6 py-4 flex items-center justify-between">
                            <div className="flex items-center space-x-3.5">
                                <div className={`w-11 h-11 rounded-full ${isDarkMode ? 'bg-champagne-200 text-obsidian-950' : 'bg-obsidian-900 text-champagne-100'} flex items-center justify-center font-luxury-serif font-bold text-xl shadow-sm transition-all`}>
                                    YP
                                </div>
                                <div>
                                    <h1 className={`font-luxury-serif text-2xl font-bold tracking-wide ${isDarkMode ? 'text-champagne-100' : 'text-obsidian-900'} leading-none`}>
                                        YabadabaPW
                                    </h1>
                                    <p className={`text-[10px] uppercase tracking-widest font-semibold mt-1 ${isDarkMode ? 'text-champagne-400' : 'text-obsidian-500'}`}>
                                        Custom Rule-Compliant Strong Password Generator
                                    </p>
                                </div>
                            </div>

                            {/* Theme Toggle Button */}
                            <button
                                onClick={() => setIsDarkMode(!isDarkMode)}
                                className={`px-4 py-2 rounded-full border text-xs font-semibold tracking-wider transition-all flex items-center space-x-2 shadow-sm ${
                                    isDarkMode
                                        ? 'bg-obsidian-800/80 border-obsidian-700 text-champagne-200 hover:bg-obsidian-800'
                                        : 'bg-white/80 border-champagne-300 text-obsidian-800 hover:bg-white'
                                }`}
                                aria-label="Toggle theme"
                            >
                                <span>{isDarkMode ? '○' : '◐'}</span>
                                <span>{isDarkMode ? 'Champagne' : 'Obsidian'}</span>
                            </button>
                        </div>
                    </header>

                    {/* Main Content Area */}
                    <main className="max-w-3xl mx-auto px-6 py-8 w-full flex-grow space-y-6">
                        
                        {/* Sculpted Password Viewport Card */}
                        <div className={`rounded-[32px] p-7 border transition-all ${
                            isDarkMode
                                ? 'bg-obsidian-900 border-obsidian-800/80 shadow-sculptural-dark'
                                : 'bg-[#FAF6F0] border-champagne-300/80 shadow-sculptural-light'
                        }`}>
                            <div className="flex justify-between items-center mb-3">
                                <div className="flex items-center space-x-2">
                                    <span className={`w-2 h-2 rounded-full ${isDarkMode ? 'bg-champagne-400' : 'bg-champagne-600'}`}></span>
                                    <label className={`text-xs font-semibold uppercase tracking-widest ${isDarkMode ? 'text-champagne-400' : 'text-obsidian-500'}`}>
                                        Generated Key
                                    </label>
                                </div>
                                {!isError && (
                                    <div className={`px-3 py-1 rounded-full text-xs font-medium tracking-wide border flex items-center space-x-1.5 ${
                                        isDarkMode
                                            ? 'bg-obsidian-800 border-obsidian-700 text-champagne-300'
                                            : 'bg-champagne-200/60 border-champagne-300 text-obsidian-700'
                                    }`}>
                                        <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 inline-block"></span>
                                        <span className="font-luxury-serif font-bold text-sm tracking-wide">{strength.bits} BITS</span>
                                        <span className="text-[11px] opacity-40">•</span>
                                        <span>{strength.label}</span>
                                    </div>
                                )}
                            </div>

                            {/* Password Box & Primary Action Buttons */}
                            <div className="flex flex-col sm:flex-row items-stretch sm:items-center gap-3">
                                <div 
                                    className={`rounded-2xl px-5 py-4 font-mono text-xl sm:text-2xl tracking-wider flex-grow select-all break-all border transition-colors ${
                                        isError
                                            ? 'border-rose-500/50 text-rose-500 bg-rose-500/10'
                                            : isDarkMode 
                                                ? 'bg-obsidian-950/90 border-obsidian-800 text-champagne-100' 
                                                : 'bg-white/90 border-champagne-300 text-obsidian-900'
                                    }`}
                                >
                                    {String(password || '')}
                                </div>
                                <div className="flex gap-2 shrink-0">
                                    <button
                                        onClick={() => copyToClipboard(password)}
                                        disabled={isError}
                                        className={`px-6 py-4 font-semibold text-xs uppercase tracking-widest rounded-2xl transition-all flex items-center justify-center space-x-2 shadow-sm ${
                                            isError
                                                ? 'opacity-40 cursor-not-allowed bg-zinc-300 text-zinc-500'
                                                : copied 
                                                    ? 'bg-emerald-700 text-white' 
                                                    : isDarkMode 
                                                        ? 'bg-champagne-200 hover:bg-champagne-100 text-obsidian-950' 
                                                        : 'bg-obsidian-900 hover:bg-obsidian-800 text-champagne-100'
                                        }`}
                                    >
                                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            {copied ? (
                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"/>
                                            ) : (
                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"/>
                                            )}
                                        </svg>
                                        <span>{copied ? 'Copied' : 'Copy'}</span>
                                    </button>

                                    <button
                                        onClick={saveToList}
                                        disabled={isError}
                                        className={`p-4 rounded-2xl border transition-all flex items-center justify-center shadow-sm ${
                                            isError
                                                ? 'opacity-40 cursor-not-allowed'
                                                : isDarkMode 
                                                    ? 'bg-obsidian-800 hover:bg-obsidian-750 border-obsidian-700 text-champagne-200' 
                                                    : 'bg-white/80 hover:bg-white border-champagne-300 text-obsidian-800'
                                        }`}
                                        title="Save password to vault"
                                    >
                                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"/>
                                        </svg>
                                    </button>

                                    <button
                                        onClick={generatePassword}
                                        className={`p-4 rounded-2xl border transition-all flex items-center justify-center shadow-sm active:rotate-180 duration-500 ${
                                            isDarkMode 
                                                ? 'bg-obsidian-800 hover:bg-obsidian-750 border-obsidian-700 text-champagne-200' 
                                                : 'bg-white/80 hover:bg-white border-champagne-300 text-obsidian-800'
                                        }`}
                                        title="Generate new key"
                                    >
                                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                                        </svg>
                                    </button>
                                </div>
                            </div>

                            {/* Minimalist Segmented Line Gauge */}
                            {!isError && (
                                <div className="mt-4">
                                    <div className={`w-full h-1.5 rounded-full overflow-hidden ${isDarkMode ? 'bg-obsidian-800' : 'bg-champagne-200'}`}>
                                        <div 
                                            className={`h-full transition-all duration-300 rounded-full ${
                                                isDarkMode 
                                                    ? 'bg-gradient-to-r from-champagne-400 to-champagne-100' 
                                                    : 'bg-gradient-to-r from-champagne-600 to-obsidian-900'
                                            }`}
                                            style={{ width: strength.width }}
                                        />
                                    </div>
                                </div>
                            )}

                            {saveNotification && (
                                <p className="text-xs font-medium mt-3 text-emerald-600 dark:text-emerald-400 flex items-center space-x-1">
                                    <span>✓</span>
                                    <span>Preserved in your local vault below.</span>
                                </p>
                            )}
                        </div>

                        {/* Sculptural Configuration Dashboard Card */}
                        <div className={`rounded-[32px] p-7 border space-y-6 transition-all ${
                            isDarkMode 
                                ? 'bg-obsidian-900 border-obsidian-800/80 shadow-sculptural-dark' 
                                : 'bg-[#FAF6F0] border-champagne-300/80 shadow-sculptural-light'
                        }`}>
                            
                            {/* Length Slider & Quick Chips */}
                            <div className="space-y-3">
                                <div className="flex justify-between items-center text-xs font-semibold uppercase tracking-widest">
                                    <span className={isDarkMode ? 'text-champagne-300' : 'text-obsidian-600'}>
                                        Length Specifications
                                    </span>
                                    <div className="flex items-center space-x-2">
                                        <div className="flex space-x-1">
                                            {[12, 16, 24, 32].map((preset) => (
                                                <button
                                                    key={preset}
                                                    type="button"
                                                    onClick={() => setLength(preset)}
                                                    className={`px-2.5 py-1 rounded-lg text-xs font-mono transition-all border ${
                                                        length === preset
                                                            ? isDarkMode 
                                                                ? 'bg-champagne-200 text-obsidian-950 border-champagne-200 font-bold' 
                                                                : 'bg-obsidian-900 text-champagne-100 border-obsidian-900 font-bold'
                                                            : isDarkMode 
                                                                ? 'border-obsidian-800 text-champagne-400 hover:bg-obsidian-800' 
                                                                : 'border-champagne-300 text-obsidian-600 hover:bg-champagne-200/60'
                                                    }`}
                                                >
                                                    {preset}
                                                </button>
                                            ))}
                                        </div>
                                        <span className={`font-mono px-3 py-1 rounded-full border text-xs font-bold ${
                                            isDarkMode 
                                                ? 'bg-obsidian-950 border-obsidian-800 text-champagne-200' 
                                                : 'bg-white/80 border-champagne-300 text-obsidian-900'
                                        }`}>
                                            {String(length)} Chars
                                        </span>
                                    </div>
                                </div>
                                <input
                                    type="range"
                                    min="8"
                                    max="64"
                                    value={length}
                                    onChange={(e) => setLength(parseInt(e.target.value, 10))}
                                    className={`w-full h-1.5 rounded-lg appearance-none cursor-pointer ${
                                        isDarkMode 
                                            ? 'bg-obsidian-800 accent-champagne-300' 
                                            : 'bg-champagne-200 accent-obsidian-900'
                                    }`}
                                />
                                <div className={`flex justify-between text-[11px] font-mono ${isDarkMode ? 'text-obsidian-400' : 'text-champagne-600'}`}>
                                    <span>8</span>
                                    <span>24</span>
                                    <span>40</span>
                                    <span>64</span>
                                </div>
                            </div>

                            <hr className={isDarkMode ? 'border-obsidian-800' : 'border-champagne-200'} />

                            {/* Character Set Toggles */}
                            <div className="space-y-3">
                                <label className={`text-xs font-semibold uppercase tracking-widest block ${isDarkMode ? 'text-champagne-400' : 'text-obsidian-500'}`}>
                                    Character Sets
                                </label>
                                <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
                                    <label className={`flex items-center space-x-2.5 p-3.5 rounded-2xl border cursor-pointer transition-all ${
                                        includeUpper 
                                            ? isDarkMode ? 'bg-champagne-200 border-champagne-200 text-obsidian-950 font-semibold' : 'bg-obsidian-900 border-obsidian-900 text-champagne-100 font-semibold' 
                                            : isDarkMode ? 'bg-obsidian-950/60 border-obsidian-800 text-champagne-500' : 'bg-white/60 border-champagne-300 text-obsidian-600'
                                    }`}>
                                        <input type="checkbox" checked={includeUpper} onChange={(e) => setIncludeUpper(e.target.checked)} className="rounded border-current accent-obsidian-900 dark:accent-champagne-300"/>
                                        <span className="text-xs">Uppercase (A-Z)</span>
                                    </label>
                                    <label className={`flex items-center space-x-2.5 p-3.5 rounded-2xl border cursor-pointer transition-all ${
                                        includeLower 
                                            ? isDarkMode ? 'bg-champagne-200 border-champagne-200 text-obsidian-950 font-semibold' : 'bg-obsidian-900 border-obsidian-900 text-champagne-100 font-semibold' 
                                            : isDarkMode ? 'bg-obsidian-950/60 border-obsidian-800 text-champagne-500' : 'bg-white/60 border-champagne-300 text-obsidian-600'
                                    }`}>
                                        <input type="checkbox" checked={includeLower} onChange={(e) => setIncludeLower(e.target.checked)} className="rounded border-current accent-obsidian-900 dark:accent-champagne-300"/>
                                        <span className="text-xs">Lowercase (a-z)</span>
                                    </label>
                                    <label className={`flex items-center space-x-2.5 p-3.5 rounded-2xl border cursor-pointer transition-all ${
                                        includeNumbers 
                                            ? isDarkMode ? 'bg-champagne-200 border-champagne-200 text-obsidian-950 font-semibold' : 'bg-obsidian-900 border-obsidian-900 text-champagne-100 font-semibold' 
                                            : isDarkMode ? 'bg-obsidian-950/60 border-obsidian-800 text-champagne-500' : 'bg-white/60 border-champagne-300 text-obsidian-600'
                                    }`}>
                                        <input type="checkbox" checked={includeNumbers} onChange={(e) => setIncludeNumbers(e.target.checked)} className="rounded border-current accent-obsidian-900 dark:accent-champagne-300"/>
                                        <span className="text-xs">Numbers (0-9)</span>
                                    </label>
                                    <label className={`flex items-center space-x-2.5 p-3.5 rounded-2xl border cursor-pointer transition-all ${
                                        includeSymbols 
                                            ? isDarkMode ? 'bg-champagne-200 border-champagne-200 text-obsidian-950 font-semibold' : 'bg-obsidian-900 border-obsidian-900 text-champagne-100 font-semibold' 
                                            : isDarkMode ? 'bg-obsidian-950/60 border-obsidian-800 text-champagne-500' : 'bg-white/60 border-champagne-300 text-obsidian-600'
                                    }`}>
                                        <input type="checkbox" checked={includeSymbols} onChange={(e) => setIncludeSymbols(e.target.checked)} className="rounded border-current accent-obsidian-900 dark:accent-champagne-300"/>
                                        <span className="text-xs">Symbols (!@#)</span>
                                    </label>
                                </div>
                            </div>

                            {/* Ambiguous Chars Toggle */}
                            <div>
                                <label className={`flex items-center space-x-2.5 p-3.5 rounded-2xl border cursor-pointer transition-all ${
                                    excludeAmbiguous 
                                        ? isDarkMode ? 'bg-champagne-200 border-champagne-200 text-obsidian-950' : 'bg-obsidian-900 border-obsidian-900 text-champagne-100' 
                                        : isDarkMode ? 'bg-obsidian-950/60 border-obsidian-800 text-champagne-400' : 'bg-white/60 border-champagne-300 text-obsidian-600'
                                }`}>
                                    <input 
                                        type="checkbox" 
                                        checked={excludeAmbiguous} 
                                        onChange={(e) => setExcludeAmbiguous(e.target.checked)} 
                                        className="rounded border-current accent-obsidian-900 dark:accent-champagne-300"
                                    />
                                    <div className="text-xs">
                                        <span className="font-semibold">Exclude Ambiguous Characters</span>
                                        <span className={`block text-[11px] font-mono mt-0.5 ${isDarkMode && excludeAmbiguous ? 'text-obsidian-800' : isDarkMode ? 'text-champagne-500' : excludeAmbiguous ? 'text-champagne-200' : 'text-obsidian-500'}`}>
                                            Filters out visually confusing chars (0, O, o, 1, l, I, |, ;, :)
                                        </span>
                                    </div>
                                </label>
                            </div>

                            {/* Leading Char & Custom Symbols Row */}
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-1">
                                <div className={`border rounded-2xl p-4 space-y-2 ${isDarkMode ? 'bg-obsidian-950/70 border-obsidian-800' : 'bg-white/70 border-champagne-300/70'}`}>
                                    <label className={`text-xs font-semibold uppercase tracking-wider block ${isDarkMode ? 'text-champagne-400' : 'text-obsidian-600'}`}>
                                        Start With (Leading Character)
                                    </label>
                                    <select
                                        value={leadingChar}
                                        onChange={(e) => setLeadingChar(e.target.value)}
                                        className={`w-full border rounded-xl px-3 py-2 text-xs font-medium focus:outline-none ${
                                            isDarkMode 
                                                ? 'bg-obsidian-900 border-obsidian-700 text-champagne-100' 
                                                : 'bg-white border-champagne-300 text-obsidian-900'
                                        }`}
                                    >
                                        <option value="any">Any (Random Start)</option>
                                        <option value="upper" disabled={!includeUpper}>Uppercase Letter (A-Z)</option>
                                        <option value="lower" disabled={!includeLower}>Lowercase Letter (a-z)</option>
                                        <option value="number" disabled={!includeNumbers}>Number (0-9)</option>
                                        <option value="symbol" disabled={!includeSymbols || !isCustomSymbolsValid()}>Symbol</option>
                                    </select>
                                </div>

                                <div className={`border rounded-2xl p-4 space-y-2 ${isDarkMode ? 'bg-obsidian-950/70 border-obsidian-800' : 'bg-white/70 border-champagne-300/70'}`}>
                                    <div className="flex justify-between items-center">
                                        <label className={`text-xs font-semibold uppercase tracking-wider ${isDarkMode ? 'text-champagne-400' : 'text-obsidian-600'}`}>
                                            Custom Allowed Symbols
                                        </label>
                                        <div className="flex space-x-1 text-[11px]">
                                            <button 
                                                type="button"
                                                onClick={() => setSymbolMode('default')} 
                                                className={`px-2.5 py-0.5 rounded-full border transition-all ${
                                                    symbolMode === 'default' 
                                                        ? isDarkMode ? 'bg-champagne-200 text-obsidian-950 border-champagne-200 font-semibold' : 'bg-obsidian-900 text-champagne-100 border-obsidian-900 font-semibold' 
                                                        : 'border-transparent text-champagne-600'
                                                }`}
                                            >
                                                Default
                                            </button>
                                            <button 
                                                type="button"
                                                onClick={() => setSymbolMode('custom')} 
                                                className={`px-2.5 py-0.5 rounded-full border transition-all ${
                                                    symbolMode === 'custom' 
                                                        ? isDarkMode ? 'bg-champagne-200 text-obsidian-950 border-champagne-200 font-semibold' : 'bg-obsidian-900 text-champagne-100 border-obsidian-900 font-semibold' 
                                                        : 'border-transparent text-champagne-600'
                                                }`}
                                            >
                                                Custom
                                            </button>
                                        </div>
                                    </div>
                                    {symbolMode === 'custom' ? (
                                        <div>
                                            <input
                                                type="text"
                                                value={customSymbols}
                                                onChange={(e) => setCustomSymbols(e.target.value)}
                                                placeholder="Enter at least 3 symbols"
                                                className={`w-full border rounded-xl px-3 py-2 text-xs font-mono focus:outline-none ${
                                                    !isCustomSymbolsValid() 
                                                        ? 'border-rose-500' 
                                                        : isDarkMode ? 'bg-obsidian-900 border-obsidian-700 text-champagne-100' : 'bg-white border-champagne-300 text-obsidian-900'
                                                }`}
                                            />
                                            {!isCustomSymbolsValid() && (
                                                <p className="text-[10px] text-rose-500 mt-1 font-medium">Require at least 3 custom symbols.</p>
                                            )}
                                        </div>
                                    ) : (
                                        <div className={`text-xs px-3 py-2 rounded-xl border font-mono truncate ${
                                            isDarkMode ? 'bg-obsidian-900 border-obsidian-800 text-champagne-400' : 'bg-white border-champagne-200 text-obsidian-600'
                                        }`}>
                                            {defaultSymbols}
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>

                        {/* Local Staging Vault Card */}
                        {Array.isArray(savedPasswords) && savedPasswords.length > 0 && (
                            <div className={`rounded-[32px] p-7 border space-y-3 transition-all ${
                                isDarkMode 
                                    ? 'bg-obsidian-900 border-obsidian-800/80 shadow-sculptural-dark' 
                                    : 'bg-[#FAF6F0] border-champagne-300/80 shadow-sculptural-light'
                            }`}>
                                <div className="flex items-center justify-between">
                                    <div className="flex items-center space-x-2">
                                        <h3 className={`font-luxury-serif text-xl font-bold tracking-wide ${isDarkMode ? 'text-champagne-100' : 'text-obsidian-900'}`}>
                                            Local Vault
                                        </h3>
                                        <span className={`text-xs font-mono px-2.5 py-0.5 rounded-full border ${
                                            isDarkMode ? 'bg-obsidian-800 border-obsidian-700 text-champagne-300' : 'bg-champagne-200 border-champagne-300 text-obsidian-700'
                                        }`}>
                                            {savedPasswords.length} stored
                                        </span>
                                    </div>
                                    <div className="flex gap-2">
                                        <button
                                            type="button"
                                            onClick={downloadListAsTxt}
                                            className={`px-3.5 py-1.5 text-xs font-semibold rounded-full border transition-all flex items-center space-x-1.5 ${
                                                isDarkMode 
                                                    ? 'bg-obsidian-800 border-obsidian-700 text-champagne-200 hover:bg-obsidian-750' 
                                                    : 'bg-white/80 border-champagne-300 text-obsidian-800 hover:bg-white'
                                            }`}
                                        >
                                            <span>Export .txt</span>
                                        </button>
                                        <button
                                            type="button"
                                            onClick={clearList}
                                            className="px-3.5 py-1.5 text-xs font-semibold rounded-full border border-rose-500/30 text-rose-500 hover:bg-rose-500/10 transition-colors"
                                        >
                                            Clear All
                                        </button>
                                    </div>
                                </div>
                                <div className="max-h-56 overflow-y-auto space-y-2 pr-1 custom-scroll">
                                    {savedPasswords.map((item, index) => (
                                        <div key={index} className={`border rounded-2xl px-4 py-2.5 flex items-center justify-between text-xs font-mono transition-all ${
                                            isDarkMode ? 'bg-obsidian-950/80 border-obsidian-800/80 text-champagne-200' : 'bg-white/80 border-champagne-300/80 text-obsidian-900'
                                        }`}>
                                            <span className="truncate mr-4 select-all">{String(item || '')}</span>
                                            <div className="flex items-center space-x-2 shrink-0">
                                                <button
                                                    type="button"
                                                    onClick={() => copyToClipboard(item, index)}
                                                    className={`text-[11px] font-sans px-3 py-1 rounded-full border transition-all ${
                                                        copiedVaultIdx === index
                                                            ? 'bg-emerald-600 text-white border-transparent'
                                                            : isDarkMode 
                                                                ? 'border-obsidian-700 hover:bg-obsidian-800 text-champagne-300' 
                                                                : 'border-champagne-300 hover:bg-champagne-200 text-obsidian-800'
                                                    }`}
                                                >
                                                    {copiedVaultIdx === index ? '✓ Copied' : 'Copy'}
                                                </button>
                                                <button
                                                    type="button"
                                                    onClick={() => removeSavedItem(index)}
                                                    className="text-zinc-400 hover:text-rose-500 p-1 rounded-full transition-colors"
                                                    title="Delete password"
                                                >
                                                    ✕
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* Security Specifications Card */}
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div className={`rounded-[28px] p-6 space-y-2 border ${
                                isDarkMode ? 'bg-obsidian-900/60 border-obsidian-800' : 'bg-[#FAF6F0]/60 border-champagne-300/60'
                            }`}>
                                <h3 className={`font-luxury-serif text-base font-bold ${isDarkMode ? 'text-champagne-200' : 'text-obsidian-900'}`}>
                                    Cryptographic Guarantee
                                </h3>
                                <p className={`text-xs leading-relaxed ${isDarkMode ? 'text-champagne-400' : 'text-obsidian-600'}`}>
                                    Entropy is generated via the native browser Web Crypto API (<code className="text-[11px] font-mono px-1 rounded bg-black/5 dark:bg-white/5">crypto.getRandomValues</code>) with uniform Fisher-Yates array permutation.
                                </p>
                            </div>

                            <div className={`rounded-[28px] p-6 space-y-2 border ${
                                isDarkMode ? 'bg-obsidian-900/60 border-obsidian-800' : 'bg-[#FAF6F0]/60 border-champagne-300/60'
                            }`}>
                                <h3 className={`font-luxury-serif text-base font-bold ${isDarkMode ? 'text-champagne-200' : 'text-obsidian-900'}`}>
                                    Client-Side Privacy
                                </h3>
                                <p className={`text-xs leading-relaxed ${isDarkMode ? 'text-champagne-400' : 'text-obsidian-600'}`}>
                                    100% in-memory client operation. No network packets, telemetry, or generated credentials ever leave your browser.
                                </p>
                            </div>
                        </div>
                    </main>

                    {/* Footer */}
                    <footer className={`border-t py-6 text-center text-xs transition-colors ${
                        isDarkMode ? 'border-obsidian-800 text-champagne-500' : 'border-champagne-300/60 text-obsidian-500'
                    }`}>
                        <p className="font-luxury-serif text-sm tracking-wide">
                            YabadabaPW • Champagne Beige &amp; Obsidian Black
                        </p>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
